  if(discoveries[r.id]){
    const tw=.5+.5*Math.sin(perfNow*.005+r.id*3);
    ctx.globalAlpha=.55+.45*tw;
    ctx.font="11px serif";ctx.textAlign="center";
    ctx.fillText("✨",x+w-8,y+9-tw*2);
    ctx.textAlign="left";ctx.globalAlpha=1;
  }
}

// 城門の外の並木。春=花、夏=深緑、秋=紅葉、冬=裸枝に雪
function drawTrees(night,sIdx){
  for(const txb of [-46,-95,WORLD_W+44,WORLD_W+92]){
    const sway=Math.sin(perfNow*.0012+txb)*1.6;
    const baseY=GROUND_Y+2, topY=baseY-22;
    ctx.strokeStyle=night?"#241c12":"#4a3826";ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(txb,baseY);
    ctx.quadraticCurveTo(txb+1,baseY-12,txb+sway,topY);ctx.stroke();
    if(sIdx===3){                                  // 冬: 裸枝と雪
      ctx.lineWidth=1.5;
      for(const [dx,dy] of [[-7,-6],[6,-7],[-4,-12],[5,-13],[0,-16]]){
        ctx.beginPath();ctx.moveTo(txb+sway*.7,topY+6);
        ctx.lineTo(txb+dx+sway,topY+dy+4);ctx.stroke();
        ctx.fillStyle="rgba(255,255,255,.9)";
        ctx.fillRect(txb+dx+sway-1.5,topY+dy+3,3.5,1.6);
      }
      ctx.lineWidth=1;
    }else{
      const pal=[["#6aa552","#83b966","#97c878"],
                 ["#3f7a34","#549246","#69a75a"],
                 ["#b06a2c","#c4853a","#d49a48"]][sIdx];
      let k=0;
      for(const [dx,dy,rr2] of [[0,-4,8],[-6,1,6],[6,1,6],[0,4,7]]){
        ctx.fillStyle=night?"#1c2618":pal[k++%3];
        ctx.beginPath();ctx.arc(txb+dx+sway,topY+dy,rr2,0,7);ctx.fill();
      }
      if(sIdx===0&&!night){                        // 春: 花
        ctx.fillStyle="#eba6bd";
        for(let i=0;i<6;i++){
          const hsh=((txb*7+i*37)%13)-6;
          ctx.fillRect(txb+hsh+sway,topY-4+((i*5)%11),1.8,1.8);
        }
      }
      if(sIdx===2&&!night){                        // 秋: 舞い散る落ち葉
        for(let i=0;i<3;i++){
          const p=((perfNow*.0004)+i*.33+(txb%5)*.1)%1;
          ctx.fillStyle=`rgba(200,130,50,${.8-p*.7})`;
          ctx.fillRect(txb+8+Math.sin(p*9+i)*6,topY+p*22,2,2);
        }
      }
    }
  }
  ctx.lineWidth=1;
}
function drawBattlements(night,winter){
  for(let f=F_MIN;f<=F_MAX;f++){
    for(let c=0;c<COLS;c++){
      if(built(c,f)&&!built(c,f+1)&&f>=0){
        const x=c*TILE,y=floorTopY(f);
        const r=cellRoom(c,f);
        if(r&&ROOMS[r.type]&&ROOMS[r.type].sky)continue;  // 農場の上は空のまま
        if(r&&(r.hh||1)>1)continue;                       // 大建築は自前の屋根を持つ
        ctx.fillStyle=night?"#56504a":"#8a8276";
        ctx.fillRect(x,y-6,TILE,6);
        ctx.fillStyle="rgba(0,0,0,.25)";
        ctx.fillRect(x+TILE*0.3,y-6,TILE*0.18,4);
        ctx.fillRect(x+TILE*0.72,y-6,TILE*0.18,4);
        if(winter){
          ctx.fillStyle="rgba(255,255,255,.85)";
          ctx.fillRect(x,y-8,TILE,3);
        }
      }
    }
  }
}

function drawBanner(night){
  let best=null;
  for(let f=F_MAX;f>=0;f--){
    for(let c=0;c<COLS;c++)if(built(c,f)){if(!best||f>best[1])best=[c,f];}
    if(best)break;
  }
  if(!best)return;
  const [c,f]=best;
  const x=c*TILE+TILE/2,y=floorTopY(f)-6;
  ctx.strokeStyle="#caa53c";ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-30);ctx.stroke();ctx.lineWidth=1;
  const wave=Math.sin(perfNow*.004)*3;
  ctx.fillStyle=RANKS[rankIdx].col;
  ctx.beginPath();
  ctx.moveTo(x,y-30);
  ctx.quadraticCurveTo(x+11,y-28+wave,x+22,y-26+wave);
  ctx.lineTo(x+15,y-21+wave*.6);
  ctx.quadraticCurveTo(x+10,y-18,x,y-16);
  ctx.closePath();ctx.fill();
  ctx.strokeStyle="rgba(0,0,0,.3)";ctx.stroke();
}

// 待機中の客が今いる部屋から「振る舞い」を決める
function agentPose(a){
  if(a.path)return "walk";
  const r=cellRoom(Math.floor(a.x/TILE),a.f);
  if(!r)return "stand";
  switch(r.type){
    case "tavern":return "drink";
    case "chapel":case "monastery":case "cathedral":return "pray";
    case "quarters":case "bighouse":case "noble":case "royalsuite":return "sit";
    case "university":case "magetower":return "read";
    case "market":return "shop";
    default:return "stand";
  }
}
function drawAgent(a,night){
  const y=floorTopY(a.f)+TILE-2;
  const x=a.x;
  const s=clamp(a.stress/100,0,1);
  const lk=a.look||{};
  // 衣装の色が苛立ちで赤へ染まる（タワー流のストレス表現）
  const baseCol=a.kind==="knight"?"#2a2a30":(lk.col||"#241a10");
  const col=s>0.05?mixCol(baseCol,"#e03020",s*0.85):baseCol;
  const pose=agentPose(a);
  const ph=Math.sin(perfNow*.02*(a.speed*.22)+a.jp)*1.7;
  figure(x,y,{pose,col,ph,seed:a.jp|0,
    scale:lk.scale||1,
    hat:a.kind==="knight"?"#9aa6b2":lk.hat,
    hood:lk.hood,hair:lk.hair,skirt:lk.skirt,cape:lk.cape,
    bag:lk.bag,cane:lk.cane,sword:lk.sword,basket:lk.basket});
  if(a.kind==="knight"){                     // 兜の前立て
    ctx.fillStyle="#c03028";ctx.fillRect(x-0.5,y-13,1.6,2);
  }
  // 強い苛立ちは💢印でも分かるように
  if(s>0.66){
    ctx.fillStyle="rgba(255,70,40,.9)";
    ctx.font="6px sans-serif";ctx.fillText("💢",x+2,y-12);
  }
}

// ---------- 入力 ----------
let hoverCell=null;
let dragging=false,dragMoved=false,lastPt=null,painting=false;
function evPos(e){
  const r=cv.getBoundingClientRect();
  const p=e.touches?e.touches[0]:e;
  return [p.clientX-r.left,p.clientY-r.top];
}
// 画面上の点 (px,py) を中心に倍率を nz へ。指/カーソル下のワールド点を固定したまま拡大縮小
function setZoom(nz,sx,sy){
  const cw=cv.clientWidth,ch=cv.clientHeight;
  if(sx==null){sx=cw/2;sy=ch/2;}
  nz=clamp(nz,1,3.6);
  const wx=cam.x+sx/zoom, wy=cam.y+sy/zoom;
  zoom=nz;
  cam.x=wx-sx/zoom; cam.y=wy-sy/zoom;
}
function toCell(px,py){
  const wx=px/zoom+cam.x,wy=py/zoom+cam.y;
  const c=Math.floor(wx/TILE);
  const f=F_MIN+Math.floor((WORLD_H-GROUND_DEPTH-wy)/TILE);
  if(c<0||c>=COLS||f<F_MIN||f>F_MAX)return null;
  return [c,f];
}
function pointerDown(e){
  if(e.target!==cv)return;
  const [px,py]=evPos(e);
  lastPt=[px,py];dragMoved=false;
  const cell=toCell(px,py);
  if(tool==="select"){dragging=true;}
  else if(cell){
    if(tool==="demolish"){demolish(cell[0],cell[1]);painting=true;}
    else{
      const d=ROOMS[tool];
      const c=clamp(cell[0]-Math.floor(d.w/2),0,COLS-d.w);
      const ok=place(tool,c,cell[1]);
      if(ok&&d.w===1)painting=true;
    }
  }
  if(e.touches)e.preventDefault();
}
let pinchD=0;            // 二本指の前回距離
function pointerMove(e){
  // 二本指ピンチ → ズーム (指の中点を固定)
  if(e.touches&&e.touches.length>=2){
    const r=cv.getBoundingClientRect();
    const a=e.touches[0],b=e.touches[1];
    const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    const mx=(a.clientX+b.clientX)/2-r.left, my=(a.clientY+b.clientY)/2-r.top;
    if(pinchD>0)setZoom(zoom*(d/pinchD),mx,my);
    pinchD=d;dragging=false;painting=false;
    e.preventDefault();return;
  }
  const [px,py]=evPos(e);
  hoverCell=toCell(px,py);
  if(hoverCell&&tool!=="select"&&tool!=="demolish"){
    const d=ROOMS[tool];
    if(d)hoverCell=[clamp(hoverCell[0]-Math.floor(d.w/2),0,COLS-d.w),hoverCell[1]];
  }
  if(dragging&&lastPt){
    cam.x-=(px-lastPt[0])/zoom;cam.y-=(py-lastPt[1])/zoom;
    if(Math.abs(px-lastPt[0])+Math.abs(py-lastPt[1])>3)dragMoved=true;
    lastPt=[px,py];
  } else if(painting&&hoverCell){
    if(tool==="demolish")demolish(hoverCell[0],hoverCell[1]);
    else{
      const chk=canPlace(tool,hoverCell[0],hoverCell[1]);
      if(chk.ok)place(tool,hoverCell[0],hoverCell[1]);
    }
    lastPt=[px,py];
  }
  if(e.touches)e.preventDefault();
}
function pointerUp(e){
  if(e.touches&&e.touches.length<2)pinchD=0;
  if(!e.touches)pinchD=0;
  if(tool==="select"&&!dragMoved&&lastPt){
    const cell=toCell(lastPt[0],lastPt[1]);
    if(cell){
      const r=cellRoom(cell[0],cell[1]);
      if(r&&r.type!=="gate")showInfo(r,lastPt);
      else hideInfo();
    } else hideInfo();
  }
  dragging=false;painting=false;lastPt=null;
}
cv.addEventListener("mousedown",pointerDown);
window.addEventListener("mousemove",pointerMove);
window.addEventListener("mouseup",pointerUp);
cv.addEventListener("touchstart",pointerDown,{passive:false});
cv.addEventListener("touchmove",pointerMove,{passive:false});
cv.addEventListener("touchend",pointerUp);
// ホイール: ピンチ(ctrl)で拡大縮小、通常スクロールは視点移動
cv.addEventListener("wheel",e=>{
  e.preventDefault();
  if(e.ctrlKey){
    const r=cv.getBoundingClientRect();
    setZoom(zoom*Math.exp(-e.deltaY*0.01),e.clientX-r.left,e.clientY-r.top);
  }else{cam.x+=e.deltaX/zoom;cam.y+=e.deltaY/zoom;}
},{passive:false});
window.addEventListener("keydown",e=>{
  const s=24/zoom;
  if(e.key==="ArrowLeft")cam.x-=s;if(e.key==="ArrowRight")cam.x+=s;
  if(e.key==="ArrowUp")cam.y-=s;if(e.key==="ArrowDown")cam.y+=s;
  if(e.key==="+"||e.key==="=")setZoom(zoom*1.25);
  if(e.key==="-"||e.key==="_")setZoom(zoom/1.25);
});
document.getElementById("zoomIn").addEventListener("click",()=>setZoom(zoom*1.3));

// ---------- UI ----------
const toolbar=document.getElementById("toolbar");
const catbar=document.getElementById("catbar");
function toolVisible(t){
  const d=ROOMS[t];
  return !(d.route&&route&&route!==d.route);     // 選ばなかった道は非表示
}
function toolLock(t){
  const d=ROOMS[t];
  if(isCreative())return null;
  if(rankIdx<d.rank)return "🔒"+RANKS[d.rank].name;
  if(d.route&&!route)return "🔒道の選択後";
  if(d.mile&&!milestones[d.mile])return "🔒"+(route?loreName():"研究")+"80";
  if(d.era&&era<d.era)return "🔒"+ERAS[d.era].name;
  if(d.needFaith&&res.faith<d.needFaith)return "🔒信仰"+d.needFaith;
  return null;
}
function updateToolbar(){
  // ---- カテゴリタブ ----
  catbar.innerHTML="";
  for(const cat of TOOL_CATS){
    const vis=cat.tools.filter(toolVisible);
    if(!vis.length)continue;
    const unlocked=vis.filter(t=>!toolLock(t)).length;
    const tab=document.createElement("div");
    tab.className="cat-tab"+(toolCat===cat.id?" on":"");
    tab.innerHTML=`${cat.name}<span class="cnt">${unlocked}/${vis.length}</span>`;
    tab.addEventListener("click",()=>{toolCat=cat.id;updateToolbar();});
    catbar.appendChild(tab);
  }
  // ---- 道具列 (調べる/撤去は常設 + 現在カテゴリの施設) ----
  toolbar.innerHTML="";
  const cat=TOOL_CATS.find(c=>c.id===toolCat)||TOOL_CATS[0];
  const list=["select","demolish",...cat.tools.filter(toolVisible)];
  for(const t of list){
    const el=document.createElement("div");
    el.className="tool"+(tool===t?" sel":"");
    if(t==="select"){
      el.innerHTML=`<span class="t-ico">👆</span><span class="t-name">調べる</span><span class="t-cost">移動/情報</span>`;
    }else if(t==="demolish"){
      el.innerHTML=`<span class="t-ico">🔨</span><span class="t-name">撤去</span><span class="t-cost">半額返金</span>`;
    }else{
      const d=ROOMS[t];
      const lockTxt=toolLock(t);
      if(lockTxt)el.classList.add("locked");
      const name=t==="mlift"?(route==="fantasy"?"魔法昇降機":route==="real"?"水力昇降機":"特殊昇降機")
                :t==="skyhall"&&route==="real"?"大聖堂の尖塔":d.name;
      el.innerHTML=`<span class="t-ico">${d.ico}</span><span class="t-name">${name}</span>
        <span class="t-cost">${lockTxt?lockTxt:costLabel(d)}</span>`;
      if(lockTxt){toolbar.appendChild(el);continue;}
    }
    el.addEventListener("click",()=>{
      tool=t;updateToolbar();hideInfo();
      cv.classList.toggle("building",t!=="select");
      if(AC===null&&soundOn)beep(440,.04,"square",.02);
    });
    toolbar.appendChild(el);
  }
}

    `<div style="font-size:11px;color:#8e2b2b;margin-bottom:4px;">真上に建物があり、日が当たりません</div>`:

      <button id="ipLoan">${flags.debt>0?"返済残 "+fmt(flags.debt)+"G":"💰 融資 +2,000G"}</button>
      <button id="ipInvest">${flags.invest?"📈 運用中(あと"+Math.max(0,flags.invest.due-day)+"日)":"📈 投資 -500G"}</button>
    </div>
    <div style="font-size:10px;color:#6e5b39;margin-top:3px;">融資: 2,000G即金・計2,600Gを130G/日で返済／投資: 約2季節で350〜1,100Gに化ける</div>`:"";
  // ✨ 発見イベント (この部屋に何かが隠れている)
  const discUI=discoveries[r.id]
    ?`<button id="ipDisc" style="width:100%;margin-top:7px;padding:7px;border-radius:4px;cursor:pointer;
        background:linear-gradient(135deg,#fff3c4,#ffe08a);border:1px solid #c9a227;color:#7a5a00;font-weight:bold;">

function toast(msg,cls=""){
  const box=document.getElementById("toasts");
  const t=document.createElement("div");
  t.className="toast "+cls;t.textContent=msg;
  box.appendChild(t);
  document.getElementById("msgline").textContent=msg;
  setTimeout(()=>{t.style.transition="opacity .5s";t.style.opacity="0";
    setTimeout(()=>t.remove(),520);},4200);
  while(box.children.length>3)box.firstChild.remove();
}

function showEvoChoice(i){
  if(!hasRet(i)||retEvo[i]||rankIdx<EVO_RANK)return;
  const rt=RETAINERS[i],ev=EVOS[i];
  pauseForModal();
  sndMystic();
  showScroll(`
    <h2>⤴ 家臣の進化</h2>
    ${rt.img?`<img class="sage-portrait" style="border-color:#c9a227;box-shadow:0 0 18px rgba(220,180,60,.55)" src="${rt.img}" alt="" onerror="this.remove()">`:""}
    <div class="center"><b>${rt.name}</b>（${rt.role}）は長き奉公の果てに、新たな高みへの扉の前に立っている。<br>歩ませる道を選べ。</div>
    <div class="choice-btns">
      <button id="evoA">${ev.a.ico} ${ev.a.name}<br><small>${ev.a.buff}</small></button>
      <button id="evoB" class="alt">${ev.b.ico} ${ev.b.name}<br><small>${ev.b.buff}</small></button>
    </div>
    <div class="center" style="margin-top:8px"><small>※この選択は戻せない</small></div>
  `);
  document.getElementById("evoA").onclick=()=>doEvolve(i,"a");
  document.getElementById("evoB").onclick=()=>doEvolve(i,"b");
}
function doEvolve(i,side){
  const ev=EVOS[i][side];
  retEvo[i]=ev.k;
  closeScroll();
  toast(`⤴ ${RETAINERS[i].name}は『${ev.name}』へと進化した！ ${ev.buff}`,"gold");
  sndFanfare();
  recomputeHappiness();updateHUD();saveGame();
}
window.__evo=(i)=>{closeScroll();setTimeout(()=>showEvoChoice(i),60);};

// ---------- ストレージ層 ----------
// window.storage はアーティファクト環境のAPI名残で未定義だった (= セーブが
// 動いていなかった)。localStorage 実装 + AMJ アカウントへのクラウド同期で復活。
// クラウドは同一オリジンの /api/arcade/save (未ログイン/失敗は黙って local のみ)。
const SAVE_KEY="castle_chronicle_v2", GAME_KEY="castle-chronicle";
let cloudTimer=null, cloudUsed=false;
window.storage={
  async get(k){const v=localStorage.getItem(k);return v==null?null:{value:v};},
  async set(k,v){localStorage.setItem(k,v);if(k===SAVE_KEY)cloudPush(v);},
  async delete(k){localStorage.removeItem(k);if(k===SAVE_KEY)cloudWipe();},
};
function cloudPush(v){
  clearTimeout(cloudTimer);
  cloudTimer=setTimeout(()=>{
    try{
      fetch("/api/arcade/save",{method:"PUT",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({game:GAME_KEY,data:JSON.parse(v)})}).catch(()=>{});
    }catch(_){}
  },4000); // 連続セーブをまとめて4秒後に1回だけ送る
}
function cloudWipe(){
  try{fetch("/api/arcade/save?game="+GAME_KEY,{method:"DELETE"}).catch(()=>{});}catch(_){}
}
async function cloudLoad(){
  try{
    const r=await fetch("/api/arcade/save?game="+GAME_KEY);
    if(!r.ok)return null;
    const j=await r.json();
    return j&&j.data?j.data:null;
  }catch(_){return null;}
}

    ver:2, savedAt:Date.now(),
    rooms:Object.values(rooms).map(r=>({id:r.id,type:r.type,f:r.f,c:r.c,w:r.w,occ:r.occ}))};
}

// セーブから部屋とグリッドを再構築。
// 大建築(hh:2)は2段ぶん埋めるが、旧セーブで真上に別の部屋が載っている場合は
// 衝突を避けて高さ1のまま運用する(壊して建て直せば大広間になる)
function rebuildRooms(list){
  grid={};rooms={};
  // 第1段: 基部だけ埋める
  for(const rr of list){
    if(!ROOMS[rr.type]&&rr.type!=="gate")continue;
    rooms[rr.id]={...rr,hh:1,happy:70,active:false};
    for(let i=0;i<rr.w;i++)grid[key(rr.c+i,rr.f)]=rr.id;
  }
  // 第2段: 大建築の上層を、空いていれば確保
  for(const id in rooms){
    const r=rooms[id];const d=ROOMS[r.type];
    const hh=d&&d.hh||1;
    if(hh<2)continue;
    let free=true;
    for(let j=1;j<hh;j++)for(let i=0;i<r.w;i++)
      if(grid.hasOwnProperty(key(r.c+i,r.f+j))){free=false;break;}
    if(free){
      r.hh=hh;
      for(let j=1;j<hh;j++)for(let i=0;i<r.w;i++)grid[key(r.c+i,r.f+j)]=r.id;
    }
  }
}
async function loadGame(){
  try{
    if(!window.storage)return false;
    let raw=null;
    try{const r2=await window.storage.get("castle_chronicle_v2");raw=r2&&r2.value;}catch(e){}
    // クラウド (AMJアカウント) のセーブと比較し、新しい方を採用
    try{
      const cloud=await cloudLoad();
      if(cloud){
        const localAt=raw?(JSON.parse(raw).savedAt||0):0;
        if((cloud.savedAt||1)>=localAt){
          raw=JSON.stringify(cloud);
          localStorage.setItem(SAVE_KEY,raw);
          cloudUsed=true;
        }
      }
    }catch(e){}
    if(raw){
      const d=JSON.parse(raw);
      rebuildRooms(d.rooms);
      res=Object.assign({gold:0,food:0,wood:0,stone:0,lore:0,iron:0,faith:0,fame:0},d.res);
      era=d.era||0;
      day=d.day;rankIdx=d.rankIdx||0;maxRankSeen=d.maxRankSeen||rankIdx;
      nextRoomId=d.nextRoomId||1000;throneBuilt=!!d.throneBuilt;skyBuilt=!!d.skyBuilt;
      won=!!d.won;route=d.route||null;sageShown=!!d.sageShown;
      milestones=d.milestones||{};undergroundEnd=!!d.undergroundEnd;
      lastEventDay=d.lastEventDay||0;retEvo=d.retEvo||{};
      personality=Object.assign({tyranny:50,mercy:50,greed:50,tradition:50,control:50},d.personality);
      worldView=Object.assign({realism:50,fantasy:50},d.worldView);
      gameMode=d.gameMode||{kind:"endless",diff:"normal"};  // 旧セーブはエンドレス標準として継続
      scenarioCh=d.scenarioCh||1;
      endings=d.endings||{};chains=d.chains||{};flags=d.flags||{};
      happyStreak=d.happyStreak||0;miseryStreak=d.miseryStreak||0;
      inventory=d.inventory||{};
      sagas=d.sagas||{};
      discoveries={};
      for(const rid in (d.discoveries||{}))      // 撤去済みの部屋の✨は捨てる
        if(rooms[rid]&&DISCOVERIES[d.discoveries[rid]])discoveries[rid]=d.discoveries[rid];
      if(undergroundEnd&&!endings.under)endings.under=true; // 旧実績を結末に引き継ぐ
      if(won&&!endings.sky)endings.sky=true;
      return true;
    }
    // 旧版(キャッスル・キーパー)からの引き継ぎ
    try{
      const r1=await window.storage.get("castle_keeper_v1");
      if(r1&&r1.value){
        const d=JSON.parse(r1.value);
        rebuildRooms(d.rooms);
        res.gold=d.gold||5000;day=d.day||1;rankIdx=Math.min(d.rankIdx||0,4);
        maxRankSeen=rankIdx;nextRoomId=d.nextRoomId||1000;throneBuilt=!!d.throneBuilt;
        res.food=120;res.wood=80;res.stone=40;
        gameMode={kind:"endless",diff:"normal"};
        toast("📜 旧き記録を引き継いだ。年代記は新たな章へ");
        return true;
      }
    }catch(e){}
    return false;
  }catch(e){return false;}
}

// ---------- メインループ ----------
let perfNow=0,lastT=0,hudTimer=0,happyTimer=0;
function loop(ts){
  perfNow=ts;
  const dt=Math.min(.05,(ts-lastT)/1000);lastT=ts;
  const gdt=dt*speed;
  if(gdt>0){
    dayT+=gdt/DAY_LEN;
    if(dayT>=1){dayT-=1;day++;dailyTick();updateHUD();}
    agentTick(dt);
    happyTimer+=gdt;
    if(happyTimer>4){happyTimer=0;recomputeHappiness();if(infoRoomId!==null)renderInfo();}
    // 竜の巣があればたまに夜間飛翔
    if(!dragon&&route==="fantasy"&&isNight()&&countType("roost")>0&&Math.random()<gdt*0.02)startDragon();
  }
  hudTimer+=dt;
  if(hudTimer>.5){hudTimer=0;updateHUD();}
  draw();
  requestAnimationFrame(loop);
}

  else if(diff==="hard"){res={gold:3500,food:60,wood:60,stone:25,lore:0,iron:0,faith:0,fame:0};}
  else if(diff==="nightmare"){res={gold:2500,food:50,wood:50,stone:20,lore:0,iron:0,faith:0,fame:0};}

  }else if(special==="mont"){
    res.food+=40;
    specHtml=`<hr><div class="chapter"><b>🌊 潮の城</b>この丘は一日にして島となり、また陸へ戻る。満潮(6日ごと)には地上1階の商いと畑が休み、引き潮の浜は恵みをくれる。階上に商いを移す知恵が試される。<br><br>目標：3年生存・人口300</div>`;
  }else if(special==="under"){
    res.stone+=30;res.wood+=20;
    specHtml=`<hr><div class="chapter"><b>⛏ 地下帝国</b>地上は戦乱で焼かれた。生きる場所は、地の底にしかない。地上に建てることは許されぬ——🍄茸園(冬も実る)と⛏石切場で、深く、深く。<br><br>目標：地下だけで人口300</div>`;
  }
  updateToolbar();updateHUD();
  const scen=kind==="scenario"?`<hr><div class="chapter"><b>📯 ${SCENARIO_CH[1].t}</b>${SCENARIO_CH[1].open}<br><br>目標：${SCENARIO_CH[1].goal}</div>`:specHtml;
  const cre=kind==="creative"?`<hr><div class="center"><small>🎨 クリエイティブ：金貨・資材・食料は尽きず、全施設が最初から建てられる</small></div>`:"";
  showScroll(`
    <h2>領地拝領の証</h2>
    <div class="center">辺境の丘に、一つの<b>大門</b>が築かれた。<br>
    そなたはこの地の城主——年代記の最初の頁である。</div>
    <hr>
    <div style="font-size:13px"><span class="help-k">まずは——</span><br>
    ① 大門の左右に <b>🧺市場</b>・<b>🛏居住区</b>・<b>🌾農場</b>を建てよ（金と人と食の基本）。<br>
    ② <b>🌀らせん階段</b>と<b>🧱通路</b>で2階へ。城は上へ上へと育つ。<br>
    ③ 人口30で「砦」へ昇格。家臣<b>ローランド卿</b>が仕官するだろう。<br>
    ④ <b>冬</b>が来る前に食料を蓄えよ。畑は雪の下では実らぬ。</div>
    ${scen}${cre}
    <hr>
    <div class="center"><small>詳しい心得は右上の 📜 でいつでも読める。<br>そなたの選択は<b>領主の性格</b>と<b>世界観</b>に刻まれ、城の運命を変えていく</small></div>
    <button onclick="window.__closeScroll()">築城を始める</button>
  `);
  saveGame();
}

// ---------- 起動 ----------
(async function init(){
  resize();
  // 既定ズームに合わせて大門を画面中央に
  cam.x=(GATE_C+GATE_W/2)*TILE-(cv.clientWidth/zoom)/2;
  cam.y=floorTopY(0)-(cv.clientHeight/zoom)*0.6;
  const loaded=await loadGame();
  if(!loaded){
    placeGate();
    setTimeout(()=>{showModeSelect();},400);
  }else{
    if(!rooms[0])placeGate();
    toast(cloudUsed
      ?"☁️ クラウドの記録を読み込んだ。"+yearNum()+"年目の朝——城は何処でもそなたと共に"
      :"📜 "+yearNum()+"年目の朝。城は今日も健在だ");
  }
  recomputeReach();recomputeHappiness();
  updateToolbar();updateHUD();
  requestAnimationFrame(ts=>{lastT=ts;loop(ts);});
})();
</script>
</body>
</html>
