<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-N7LGJMFYHL"></script>

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Castle Chronicle 〜城塞年代記〜</title>
<style>
  :root{
    --parchment:#e9dcb8; --parchment-dark:#d4c293; --ink:#3a2c1a;
    --wood:#4a3422; --wood-dark:#332315; --crimson:#8e2b2b;
    --gold:#c9a227; --gold-bright:#e8c84a; --stone:#8a8578;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:#1a1410;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:var(--ink);
    touch-action:none;}
  #game{position:fixed;inset:0;}
  canvas{display:block;width:100%;height:100%;cursor:grab;}
  canvas.building{cursor:crosshair;}

  /* ===== 上部バナー ===== */
  #topbar{position:fixed;top:0;left:0;right:0;height:52px;display:flex;align-items:center;gap:9px;
    padding:0 12px;background:linear-gradient(#5a4129,#3e2c19);
    border-bottom:3px solid #241808; box-shadow:0 3px 10px rgba(0,0,0,.5);z-index:20;
    font-size:13px;color:#f0e4c4;white-space:nowrap;overflow-x:auto;scrollbar-width:none;}
  #topbar::-webkit-scrollbar{display:none}
  .stat{display:flex;align-items:center;gap:4px;flex:0 0 auto;}
  .stat .ico{font-size:16px;}
  .stat b{font-size:15px;letter-spacing:.3px;color:#fff;font-variant-numeric:tabular-nums;}
  .stat.buyable{cursor:pointer;border:1px dashed #7a623e;border-radius:4px;padding:2px 6px;}
  .stat.buyable:active{background:#6b5234;}
  #goldDelta{font-size:10px;margin-left:1px;}
  #rankBadge{display:flex;align-items:center;gap:6px;background:var(--crimson);
    border:2px solid var(--gold);border-radius:4px;padding:3px 10px;flex:0 0 auto;
    font-weight:bold;font-size:13px;color:#ffe9a8;text-shadow:0 1px 2px rgba(0,0,0,.6);}
  .spacer{flex:1;min-width:8px;}
  .tb-btn{flex:0 0 auto;background:#2b1d0f;border:1px solid #6b5234;color:#e9dcb8;border-radius:4px;
    padding:5px 9px;font-size:14px;cursor:pointer;line-height:1;}
  .tb-btn.on{background:var(--gold);color:#2b1d0f;border-color:#fff3c4;}
  #msgline{flex:0 1 auto;font-size:11px;color:#d8c89a;overflow:hidden;text-overflow:ellipsis;max-width:26vw;}

  /* ===== 下部ツールベルト (カテゴリタブ + 道具列) ===== */
  #toolwrap{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;flex-direction:column;
    background:linear-gradient(#4a3422,#2e2012);border-top:3px solid #241808;
    box-shadow:0 -3px 10px rgba(0,0,0,.5);}
  #catbar{display:flex;gap:4px;padding:6px 10px 0;overflow-x:auto;scrollbar-width:none;}
  #catbar::-webkit-scrollbar{display:none}
  .cat-tab{flex:0 0 auto;background:#2b1d0f;border:1px solid #6b5234;border-bottom:none;color:#d8c89a;
    border-radius:6px 6px 0 0;padding:5px 11px;font-size:11px;cursor:pointer;white-space:nowrap;
    user-select:none;line-height:1.2;}
  .cat-tab.on{background:var(--parchment);color:#3a2c1a;font-weight:bold;border-color:#9a8458;}
  .cat-tab .cnt{font-size:9px;color:#9a8458;margin-left:3px;}
  .cat-tab.on .cnt{color:#7a5c20;}
  #toolbar{display:flex;gap:6px;padding:6px 10px 8px;overflow-x:auto;scrollbar-width:thin;}
  .tool{flex:0 0 auto;min-width:76px;background:var(--parchment);border:2px solid #9a8458;border-radius:6px;
    padding:6px 6px 5px;text-align:center;cursor:pointer;user-select:none;
    box-shadow:0 2px 0 #1d1408;transition:transform .05s;}
  .tool:active{transform:translateY(1px);}
  .tool .t-ico{font-size:20px;line-height:1.1;display:block;}
  .tool .t-name{font-size:11px;font-weight:bold;display:block;margin-top:1px;}
  .tool .t-cost{font-size:9px;color:#7a5c20;display:block;line-height:1.3;}
  .tool.sel{background:var(--gold-bright);border-color:#fff;box-shadow:0 0 8px rgba(232,200,74,.8);}
  .tool.locked{filter:grayscale(1) brightness(.65);cursor:not-allowed;}
  .tool.locked .t-cost{color:#555;}

  /* ===== 情報パネル ===== */
  #infopanel{position:fixed;z-index:25;display:none;width:236px;background:var(--parchment);
    border:3px solid var(--wood);border-radius:6px;padding:10px 12px;font-size:12px;
    box-shadow:0 6px 20px rgba(0,0,0,.55);}
  #infopanel h3{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:16px;
    border-bottom:1px solid #b9a679;padding-bottom:4px;margin-bottom:6px;}
  #infopanel .row{display:flex;justify-content:space-between;margin:3px 0;}
  .happybar{height:8px;background:#c9b98e;border-radius:4px;overflow:hidden;margin:4px 0 6px;}
  .happybar div{height:100%;border-radius:4px;}
  #infopanel .ip-btns{display:flex;gap:6px;margin-top:8px;}
  #infopanel button{flex:1;border:1px solid var(--wood);background:#f3ead0;border-radius:4px;
    padding:5px;font-size:12px;cursor:pointer;}
  #infopanel button.danger{background:#e8c0b0;color:#6e1d10;}

  /* ===== 巻物オーバーレイ ===== */
  #scrollOverlay{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;
    background:rgba(10,7,4,.72);}
  #scrollOverlay.show{display:flex;}
  .scroll{position:relative;width:min(500px,92vw);max-height:82vh;overflow-y:auto;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(120,90,40,.16), transparent 60%),
      radial-gradient(ellipse at 85% 90%, rgba(120,90,40,.2), transparent 55%),
      var(--parchment);
    border:4px double var(--wood);border-radius:4px;padding:26px 28px 24px;
    box-shadow:0 0 0 6px #c8b585, 0 14px 50px rgba(0,0,0,.7);
    font-size:14px;line-height:1.8;}
  .scroll h2{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;text-align:center;font-size:21px;
    letter-spacing:.13em;color:var(--crimson);margin-bottom:8px;}
  .scroll .seal{position:absolute;right:18px;bottom:14px;width:44px;height:44px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#c44, #7e1f1f);box-shadow:0 2px 5px rgba(0,0,0,.4);
    display:flex;align-items:center;justify-content:center;color:#ffe1c0;font-size:19px;font-weight:bold;
    font-family:serif;transform:rotate(-12deg);pointer-events:none;}
  .scroll .center{text-align:center;}
  .scroll .big-rank{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:32px;
    letter-spacing:.18em;color:#2b1d0f;text-align:center;margin:6px 0;}
  .scroll hr{border:none;border-top:1px solid #b9a679;margin:10px 0;}
  .scroll button{display:block;margin:14px auto 0;background:var(--crimson);color:#ffe9a8;border:2px solid var(--gold);
    border-radius:4px;padding:8px 24px;font-size:15px;font-weight:bold;cursor:pointer;letter-spacing:.08em;}
  .scroll .choice-btns{display:flex;gap:10px;margin-top:14px;}
  .scroll .choice-btns button{flex:1;margin:0;font-size:13px;padding:10px 8px;line-height:1.5;}
  .scroll .choice-btns button.alt{background:#46618a;}
  .scroll .help-k{font-weight:bold;color:var(--crimson);}
  .scroll small{color:#6e5b39;}
  .scroll .resetline{text-align:center;margin-top:10px;}
  .scroll .resetline button{display:inline-block;background:#6b5234;font-size:12px;padding:5px 14px;margin:0;}
  .scroll .ev-speaker{display:flex;align-items:center;gap:8px;font-size:12px;color:#6e5b39;margin-bottom:6px;}
  .scroll .retainer-list{font-size:12px;line-height:1.9;}

  /* ===== ズーム操作 ===== */
  #zoomctl{position:fixed;right:10px;bottom:118px;z-index:21;display:flex;flex-direction:column;gap:7px;}
  #zoomctl button{width:42px;height:42px;border-radius:50%;border:2px solid #9a8458;
    background:rgba(43,29,15,.86);color:#f0e4c4;font-size:22px;font-weight:bold;cursor:pointer;
    box-shadow:0 2px 7px rgba(0,0,0,.55);line-height:1;display:flex;align-items:center;justify-content:center;}
  #zoomctl button:active{background:#6b5234;transform:translateY(1px);}

  /* トースト */
  #toasts{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:30;display:flex;
    flex-direction:column;gap:6px;align-items:center;pointer-events:none;max-width:94vw;}
  .toast{background:rgba(38,26,12,.92);color:#f0e4c4;border:1px solid var(--gold);border-radius:4px;
    padding:6px 16px;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.5);animation:tin .25s ease-out;
    max-width:94vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .toast.gold{color:var(--gold-bright);}
  .toast.bad{color:#f0a08a;border-color:#a05030;}
  .toast.magic{color:#cda8f0;border-color:#7a50a8;}
  @keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  /* キャラ/イベント画像 (img/ 配下・2026-06-12 ジェフ兄制作) */
  .ev-illust{display:block;width:100%;max-width:240px;margin:8px auto;border-radius:8px;
    border:2px solid #8a6f3e;box-shadow:0 4px 14px rgba(0,0,0,.45);}
  .ret-portrait{width:72px;height:72px;border-radius:10px;flex-shrink:0;object-fit:cover;
    border:2px solid #8a6f3e;box-shadow:0 3px 10px rgba(0,0,0,.4);}
  .sage-portrait{display:block;width:104px;height:104px;border-radius:50%;margin:6px auto 8px;
    object-fit:cover;border:3px solid #7a50a8;box-shadow:0 0 18px rgba(160,110,220,.5);}
  .ret-mini{width:24px;height:24px;border-radius:6px;vertical-align:middle;margin-right:4px;
    object-fit:cover;border:1px solid #8a6f3e;}
  /* 年代記の章 (昇格演出内の物語ブロック) */
  .chapter{margin:12px 8px 0;padding:10px 14px;border-left:3px solid #b89d62;
    background:rgba(184,157,98,.1);font-size:12px;line-height:1.95;color:#5a4a28;text-align:left;
    border-radius:0 8px 8px 0;}
  .chapter b{display:block;margin-bottom:4px;letter-spacing:.12em;color:#7a5c1e;}
  /* 家臣の進化ボタン (心得画面) */
  .evo-btn{margin-left:6px;padding:2px 10px;border-radius:999px;border:1px solid #c9a227;
    background:linear-gradient(135deg,#fff3c4,#ffe08a);color:#7a5a00;font-size:10px;
    font-weight:bold;cursor:pointer;vertical-align:middle;}
  .evo-btn:hover{filter:brightness(1.06);}
</style>
</head>
<body>
<div id="game"><canvas id="cv"></canvas></div>

<div id="topbar">
  <div id="rankBadge"><span id="rankCrest">⚑</span><span id="rankName">開拓地</span></div>
  <div class="stat"><span class="ico">🪙</span><b id="goldVal">0</b><span id="goldDelta"></span></div>
  <div class="stat"><span class="ico">🍞</span><b id="foodVal">0</b></div>
  <div class="stat buyable" id="buyWood" title="タップで木材10を購入"><span class="ico">🪵</span><b id="woodVal">0</b></div>
  <div class="stat buyable" id="buyStone" title="タップで石材10を購入"><span class="ico">🪨</span><b id="stoneVal">0</b></div>
  <div class="stat buyable" id="buyIron" style="display:none" title="タップで鉄10を購入"><span class="ico">⚙️</span><b id="ironVal">0</b></div>
  <div class="stat" id="faithStat" style="display:none"><span class="ico">🙏</span><b id="faithVal">0</b></div>
  <div class="stat" id="fameStat" style="display:none"><span class="ico">🏅</span><b id="fameVal">0</b></div>
  <div class="stat" id="loreStat" style="display:none"><span class="ico" id="loreIco">📖</span><b id="loreVal">0</b></div>
  <div class="stat" id="eraStat" title="時代"><span class="ico" id="eraIco">🕯</span><b id="eraVal" style="font-size:11px">暗黒時代</b></div>
  <div class="stat"><span class="ico">👥</span><b id="popVal">0</b></div>
  <div class="stat"><span class="ico" id="seasonIco">🌸</span><b id="dayVal">1年 春1日</b></div>
  <span class="ico" id="clockIco" style="font-size:16px">☀️</span>
  <div class="spacer"></div>
  <div id="msgline"></div>
  <button class="tb-btn" id="spd0">⏸</button>
  <button class="tb-btn on" id="spd1">▶</button>
  <button class="tb-btn" id="spd3">⏩</button>
  <button class="tb-btn" id="sndBtn">🔔</button>
  <button class="tb-btn" id="helpBtn">📜</button>
</div>

<div id="toolwrap"><div id="catbar"></div><div id="toolbar"></div></div>
<div id="infopanel"></div>
<div id="toasts"></div>
<div id="zoomctl"><button id="zoomIn" title="拡大">＋</button><button id="zoomOut" title="縮小">－</button></div>
<div id="scrollOverlay"><div class="scroll" id="scrollBody"></div></div>

<script>
"use strict";
/* ============================================================
   Castle Chronicle 〜城塞年代記〜
   タワー型経営シミュレーション × 中世城塞（オリジナル）
   小さな砦から、天空城郭へ。
   ============================================================ */

// ---------- 定数 ----------
const TILE = 26;
const COLS = 44;
const F_MIN = -9, F_MAX = 49;            // 地下10階〜地上50階(0=1F)
const SKY_H = 220;
const GROUND_DEPTH = (0 - F_MIN + 1.5) * TILE;
const WORLD_W = COLS * TILE;
const WORLD_H = SKY_H + (F_MAX - F_MIN + 1) * TILE + TILE * 2;
const DAY_LEN = 62;                       // 1日 = 62秒(等速)
const SEASON_LEN = 6;                     // 1季節 = 6日
const SEASONS = [
  {name:"春",ico:"🌸",farm:1.2,visit:1.0,ground:"#4d6b35"},
  {name:"夏",ico:"☀️",farm:1.5,visit:1.1,ground:"#3f6628"},
  {name:"秋",ico:"🍂",farm:1.1,visit:1.0,ground:"#6b5a2c"},
  {name:"冬",ico:"❄️",farm:0,  visit:0.55,ground:"#cfd6dc"},
];
const GATE_C = 20, GATE_W = 4;

// 時代進化 (暗黒時代→中世盛期→ルネサンス)。商いの勢いが時代と共に伸びる
const ERAS=[
  {name:"暗黒時代", ico:"🕯", mul:1.0},
  {name:"中世盛期", ico:"🏰", mul:1.1},
  {name:"ルネサンス",ico:"🎨", mul:1.25},
];
// 信仰の祝福 (信仰の蓄えで段階解放)
const FAITH_TIERS=[
  {th:50, name:"収穫の祈り", msg:"🙏 祝福『収穫の祈り』！ 農場の実りが15%増す"},
  {th:150,name:"大祝祭",     msg:"🙏 祝福『大祝祭』！ 全住居の幸福+3が続く"},
  {th:300,name:"守護の奇跡", msg:"🙏 祝福『守護の奇跡』！ 凶事の被害が3割減る"},
];
const faithTier=()=>res.faith>=300?3:res.faith>=150?2:res.faith>=50?1:0;
const foodCap=()=>2000+400*countType("granary");

// 階位（ランク）
const RANKS = [
  {name:"開拓地",   pop:0,    crest:"⚑",  col:"#8a8578"},
  {name:"砦",       pop:30,   crest:"🛡", col:"#5e7252"},
  {name:"男爵の城", pop:110,  crest:"🦅", col:"#46618a"},
  {name:"伯爵の城", pop:240,  crest:"🦁", col:"#7a3fa0"},
  {name:"公爵の城", pop:420,  crest:"🐉", col:"#a0322e"},
  {name:"王城",     pop:650,  crest:"👑", col:"#c9a227", needsThrone:true},
  {name:"天空城郭", pop:900,  crest:"🌟", col:"#5a7ec9", needsSky:true},
];

// 家臣（昇格とともに仕官）
const RETAINERS = {
  1:{ico:"⚔️",name:"ローランド卿",role:"騎士団長",buff:"城の治安 +2",
     line:"「この剣、貴公の城壁に捧げよう」",img:"img/roland.jpg"},
  2:{ico:"💰",name:"マルコ・ヴェネツィア",role:"財務官",buff:"全収入 +8%",
     line:"「銭は血液。流れを止めてはなりませぬ」",img:"img/marco.jpg"},
  3:{ico:"📚",name:"エレオノーラ",role:"宮廷学者",buff:"知識/魔力の獲得 +25%",
     line:"「書庫の灯を絶やさぬ限り、城は賢くなり続けます」",img:"img/eleonora.jpg"},
  4:{ico:"🛠️",name:"ガストン",role:"建築家",buff:"建設費 -10%",
     line:"「儂の石組みは千年崩れん。値切るでないぞ」",img:"img/gaston.jpg"},
  5:{ico:"🎭",name:"シルヴィア",role:"諜報官",buff:"凶事の被害 半減",
     line:"「……影はすべて見ております。御安心を」",img:"img/sylvia.jpg"},
};

// 家臣の進化 (公爵=rank4 で解禁・📜心得から二択・戻せない)。仕様書 sim.md の正史準拠。
const EVO_RANK=4;
const EVOS={
  1:{a:{k:"holy", ico:"✨",name:"聖騎士",     buff:"城の治安 +4"},
     b:{k:"dark", ico:"🌑",name:"暗黒騎士",   buff:"治安 +3・撃退した夜盗から戦利品"}},
  2:{a:{k:"mogul",ico:"👑",name:"豪商",       buff:"全収入 +15%"},
     b:{k:"usurer",ico:"🩸",name:"闇金融",    buff:"全収入 +10%・資材購入 -30%"}},
  3:{a:{k:"sage", ico:"🎓",name:"大賢者",     buff:"知識/魔力の獲得 +50%"},
     b:{k:"witch",ico:"🔮",name:"魔女",       buff:"獲得 +40% (幻想の道なら +60%)"}},
  4:{a:{k:"legend",ico:"🏛",name:"伝説の棟梁",buff:"建設費 -20%"},
     b:{k:"mbuild",ico:"🪄",name:"魔法建築師",buff:"建設費 -12%・魔法障壁で治安 +1"}},
  5:{a:{k:"shadow",ico:"🌒",name:"影の支配者",buff:"凶事の被害 1/4"},
     b:{k:"double",ico:"🎭",name:"二重スパイ",buff:"被害半減のまま・時々諜報収入"}},
};
function evoOf(i){const e=retEvo[i];if(!e)return null;const ev=EVOS[i];return ev.a.k===e?ev.a:ev.b.k===e?ev.b:null;}

// 年代記の章 (昇格ごとに物語が進む)
const CHAPTERS={
  1:{t:"第一章　丘の上の砦",
     txt:"最初の冬を越えた朝、領民たちは丘を見上げた。そこにはもう「開拓地」ではなく、砦と呼べる影があった。年代記の筆は、ここから速くなる。"},
  2:{t:"第二章　鷲の旗",
     txt:"王都から男爵位の沙汰が届いた。祝宴の夜、見知らぬ老人が城門に立っていたという——賢者が問いを携えて来るのは、いつも栄光の直後である。"},
  3:{t:"第三章　獅子の座",
     txt:"市場は三つの国の言葉で値切られ、酒場の歌は朝まで絶えない。伯爵となったそなたを、領民は「丘の獅子」と呼び始めた。だが高い座は、風当たりも強い。"},
  4:{t:"第四章　竜の血盟",
     txt:"公爵——その名はもはや辺境のものではない。長く仕えた家臣たちも、新たな高みの入口に立っている。⤴ 進化の道は、📜心得から選んでやるがいい。"},
  5:{t:"第五章　王の冠",
     txt:"玉座の間に灯がともる。かつて大門ひとつだった丘は、いま王の城。だが年代記の最後の頁は、まだ白いままだ——空は、まだ遠い。"},
  6:{t:"終章　天空の年代記",
     txt:"雲の上、星の隣。人の手が築いた天が、そこにあった。年代記はここで一度閉じられる。だが城の灯は、これからも領民とともに灯り続ける。"},
};

// 施設定義  cost:{g:金, w:木, s:石}
const ROOMS = {
  corridor:{name:"通路",     ico:"🧱", w:1, cost:{g:40,w:1},   rank:0, minF:F_MIN, maxF:F_MAX,
            desc:"人が歩ける床。上階を支える土台にもなる。"},

function persShift(d){           // d = {tyranny:+5, ...}
  for(const k in d)if(k in personality)personality[k]=clamp(personality[k]+d[k],0,100);
}
function wvShift(d){             // d = {realism:+5, fantasy:-3}
  for(const k in d)if(k in worldView)worldView[k]=clamp(worldView[k]+d[k],0,100);
}
function persType(){
  const p=personality;
  if(p.tyranny<=30&&p.mercy<=40)return "tyrant";
  if(p.mercy>=70&&p.greed>=60)return "father";
  if(p.greed<=30&&p.mercy>=40)return "merchant";
  if(p.tradition>=75)return "artist";
  if(p.control<=25&&p.tyranny<=45)return "puppeteer";
  return "balanced";
}

let AC=null;
function beep(freq,dur,type="square",vol=0.05,when=0){
  if(!soundOn)return;
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(vol,AC.currentTime+when);
    g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+when+dur);
    o.connect(g);g.connect(AC.destination);
    o.start(AC.currentTime+when);o.stop(AC.currentTime+when+dur+0.02);
  }catch(e){}
}
const sndPlace=()=>{beep(180,.08,"square",.06);beep(120,.1,"square",.05,.05);};
const sndErr=()=>beep(90,.18,"sawtooth",.05);
const sndCoin=()=>{beep(900,.06,"square",.04);beep(1350,.1,"square",.04,.06);};
const sndFanfare=()=>{[523,659,784,1047].forEach((f,i)=>beep(f,.22,"triangle",.07,i*.13));};
const sndMystic=()=>{[880,740,990,1320].forEach((f,i)=>beep(f,.3,"sine",.05,i*.15));};

// ---------- 初期配置 ----------
function placeGate(){
  const r={id:0,type:"gate",f:0,c:GATE_C,w:GATE_W,occ:0,happy:100,active:true};
  rooms[0]=r;
  for(let i=0;i<GATE_W;i++)grid[key(GATE_C+i,0)]=0;

// ---------- 到達判定（BFS） ----------
const VERT=t=>t==="stairs"||t==="lift"||t==="mlift"||t==="portal";
// 歩ける床か（大建築=高さ2階分の部屋は、基部の階だけが床。上層は吹き抜け）
function walkableCell(c,f){
  const r=cellRoom(c,f);
  if(!r)return false;
  return (r.hh||1)===1||r.f===f;
}
function recomputeReach(){
  reachable=new Set();
  const q=[];
  for(let i=0;i<GATE_W;i++){q.push([GATE_C+i,0]);reachable.add(key(GATE_C+i,0));}
  while(q.length){
    const [c,f]=q.shift();
    const r=cellRoom(c,f);
    const tryAdd=(nc,nf)=>{
      if(nc<0||nc>=COLS||nf<F_MIN||nf>F_MAX)return;
      const k=key(nc,nf);
      if(!grid.hasOwnProperty(k)||reachable.has(k))return;
      if(!walkableCell(nc,nf))return;        // 大広間の吹き抜けは歩けない
      reachable.add(k);q.push([nc,nf]);
    };
    tryAdd(c-1,f);tryAdd(c+1,f);
    if(r&&VERT(r.type))tryAdd(c,f+1);
    const below=cellRoom(c,f-1);
    if(below&&VERT(below.type))tryAdd(c,f-1);
  }
  for(const id in rooms){
    const r=rooms[id];
    r.active=false;
    for(let i=0;i<r.w;i++)if(reachable.has(key(r.c+i,r.f))){r.active=true;break;}
    // 農場は青空が必要
    if(r.active&&ROOMS[r.type]&&ROOMS[r.type].sky){
      for(let i=0;i<r.w;i++)if(built(r.c+i,r.f+1)){r.active=false;r.blockedSky=true;break;}
      if(r.active)r.blockedSky=false;
    }
  }
}

// ---------- 幸福度 ----------
function noisyAt(c,f){
  const r=cellRoom(c,f);
  return r&&ROOMS[r.type]&&ROOMS[r.type].noisy;
}
function recomputeHappiness(){
  for(const id in rooms){
    const r=rooms[id];if(r.type==="gate")continue;
    let h=72;
    if(!r.active)h=15;
    else{
      const isHome=["quarters","bighouse","noble","barracks"].includes(r.type);
      if(isHome){
        let noise=0;
        if(noisyAt(r.c-1,r.f)||noisyAt(r.c+r.w,r.f))noise++;
        for(let i=0;i<r.w;i++){if(noisyAt(r.c+i,r.f+1))noise++;if(noisyAt(r.c+i,r.f-1))noise++;}
        h-=Math.min(34,noise*14);
        for(const id2 in rooms){const d=rooms[id2];
          if(d.type==="dungeon"&&Math.abs(d.f-r.f)<=1&&Math.abs(d.c-r.c)<=6){h-=10;break;}}
      }
      const pt=persType();
      for(const id2 in rooms){const ch=rooms[id2];
        if(ch.type==="chapel"&&ch.active&&Math.abs(ch.f-r.f)<=1&&
           Math.abs((ch.c+ch.w/2)-(r.c+r.w/2))<=ROOMS.chapel.aura+3){
          h+=(pt==="artist"?32:16);break;}}   // 狂気の芸術家: 美の癒し倍増
      if(pt==="tyrant")h-=6;
      else if(pt==="father")h+=8;
      else if(pt==="artist")h+=4;
      if(flags.parliament||countType("parliamenthall")>=1)h+=3; // 議会の誕生/議会場
      if(faithTier()>=2)h+=3;                  // 大祝祭
      // 庭園・妖精の泉の癒し (礼拝堂と同様の範囲効果)
      for(const id3 in rooms){const g=rooms[id3];
        if((g.type==="garden"||g.type==="fairyfountain"||g.type==="cathedral")&&g.active&&Math.abs(g.f-r.f)<=1&&
           Math.abs((g.c+g.w/2)-(r.c+r.w/2))<=(ROOMS[g.type].aura||5)+3){h+=(g.type==="cathedral"?14:10);break;}}
      if(r.f!==0){
        let near=false;
        for(let c=0;c<COLS;c++){
          const s=cellRoom(c,r.f);
          if(s&&VERT(s.type)&&Math.abs(c-(r.c+r.w/2))<=11){near=true;break;}
          const s2=cellRoom(c,r.f-1);
          if(s2&&VERT(s2.type)&&Math.abs(c-(r.c+r.w/2))<=11){near=true;break;}
        }
        if(!near)h-=18;
      }
      if((r.type==="quarters"||r.type==="bighouse")&&r.f>=4)h+=6;
      if(r.type==="noble"&&r.f>=15)h+=8;
      if(milestones.m1&&route==="fantasy")h+=4; // 魔法の灯
    }
    r.happy=clamp(Math.round(h),0,100);
  }
}

// ---------- 階級システム (仕様書§2: 農民/職人/商人/貴族/聖職者/騎士/冒険者) ----------
const CLASS_DEFS=[
  ["peasant",  "🌾","農民",    "基礎労働力。城の土台"],
  ["artisan",  "🔨","職人",    "10人以上: 工房・鍛冶屋の稼ぎ+5%"],
  ["merchant", "🧺","商人",    "10人以上: 商い全体+5%"],
  ["noble",    "🎩","貴族",    "8人以上: 名声+1/日"],
  ["clergy",   "📿","聖職者",  "6人以上: 信仰+1/日"],
  ["knight",   "🛡","騎士",    "8人以上: 治安+1"],
  ["adventurer","🗡","冒険者", "6人以上: ギルド収入+30G/日 (幻想の道)"],
];
function classBreakdown(){
  const cls={peasant:0,artisan:0,merchant:0,noble:0,clergy:0,knight:0,adventurer:0};
  for(const id in rooms){
    const r=rooms[id],d=ROOMS[r.type];if(!d)continue;
    if(d.pop){
      if(r.type==="barracks")cls.knight+=r.occ;
      else if(r.type==="noble"||r.type==="royalsuite")cls.noble+=r.occ;
      else cls.peasant+=r.occ;
    }
    if(d.workers&&r.active){
      if(["workshop","quarry","mine","blacksmith","brewery"].includes(r.type))cls.artisan+=d.workers;
      else if(r.type==="guild")cls.adventurer+=d.workers;
      else cls.merchant+=d.workers;          // 市場・酒場など
    }
    if(r.active){                            // 聖職者は祈りの場に住まう (人口外の派生階級)
      if(r.type==="chapel")cls.clergy+=2;
      else if(r.type==="monastery")cls.clergy+=3;
      else if(r.type==="cathedral")cls.clergy+=5;
    }
  }
  return cls;
}

// ---------- 人口・治安 ----------
function population(){
  let p=0;
  for(const id in rooms){
    const r=rooms[id],d=ROOMS[r.type];if(!d)continue;
    if(d.pop)p+=r.occ;
    if(d.workers&&r.active)p+=d.workers;
  }
  return p;
}
function security(){
  let s=0;
  for(const id in rooms){const r=rooms[id],d=ROOMS[r.type];
    if(d&&d.security&&r.active)s+=d.security;}
  if(hasRet(1))s+=(retEvo[1]==="holy"?4:retEvo[1]==="dark"?3:2); // ローランド卿 (進化で強化)
  if(retEvo[4]==="mbuild")s+=1;       // 魔法建築師の障壁
  if(route==="real"&&milestones.m3)s+=3; // 火薬
  if(flags.mercUntil&&day<=flags.mercUntil)s+=5; // 傭兵団
  if(persType()==="tyrant")s+=2;      // 恐怖は秩序を生む
  if(classBreakdown().knight>=8)s+=1; // 騎士階級の厚み
  if(inventory.silvercross)s+=1;      // 銀の聖印
  if(inventory.dragonshield)s+=1;     // 竜鱗の小盾
  return s;
}

// ---------- 日次処理 ----------
function dailyTick(){
  let income=0,expense=0;
  const pop=population();
  const sIdx=seasonIdx(), season=SEASONS[sIdx];
  const cls=classBreakdown();
  // 今日の天気 (春秋=よく降る/夏=夕立と雷/冬=雪なので雨なし)
  {
    const roll=Math.random(), prev=weather.kind;
    if(sIdx===3)weather.kind=roll<.04?"storm":"clear";
    else if(sIdx===1)weather.kind=roll<.12?"storm":roll<.25?"rain":"clear";
    else weather.kind=roll<.05?"storm":roll<.28?"rain":"clear";
    if(weather.kind!=="clear"&&weather.kind!==prev)
      toast(weather.kind==="storm"?"⛈ 嵐が城を包んだ。客足は鈍るが、畑はよく潤う":"🌧 雨の一日。市場は静かだが、畑には恵みの水");
    if(weather.kind==="storm"&&Math.random()<.10){
      const dmg=Math.min(res.gold,Math.round(rnd(40,140)*(faithTier()>=3?.5:1)));
      res.gold-=dmg;
      toast("⚡ 落雷！ 屋根の修繕に -"+dmg+"G"+(faithTier()>=3?"（守護の奇跡が被害を抑えた）":""),"bad");
    }
  }
  // 商いの勢い = 人口 × 季節 × 時代 × 名声 × 商人階級 × 天気
  const commerceF=clamp(pop/45,0.3,1.8)*(sIdx===3?0.85:1)
    *ERAS[era].mul*(1+Math.min(0.3,res.fame/600))*(cls.merchant>=10?1.05:1)
    *(weather.kind==="storm"?0.85:weather.kind==="rain"?0.95:1);
  const rentMul=countType("taxoffice")>=1?1.15:1;                       // 税務署
  const craftMul=(flags.guildCharter?1.2:1)*(countType("guildhall")>=1?1.25:1)
    *(cls.artisan>=10?1.05:1);                                          // ギルド・職人階級
  // モン・サン=ミッシェル: 潮汐 (6日周期。満潮=地上1階の商い・畑が休業、引き潮=浜の恵み)
  const tideHigh=isSpecial("mont")&&day%6===0;
  if(tideHigh)toast("🌊 満潮——城は海に抱かれた。地上1階の商いと畑は今日休みだ","bad");
  else if(isSpecial("mont")&&day%6===3){
    res.food=Math.min(foodCap(),res.food+8);
    toast("🦪 引き潮の浜で貝と海藻が採れた。食料+8");
  }
  let loreMul=hasRet(3)
    ?(retEvo[3]==="sage"?1.5:retEvo[3]==="witch"?(route==="fantasy"?1.6:1.4):1.25)
    :1;
  const pt=persType(), dm=diffMul();
  if(pt==="merchant")loreMul*=0.85;   // 商業王: 学芸は後回し
  if(inventory.falsebook)loreMul*=1.05; // 偽典『降臨の書』
  if(inventory.rodmap)loreMul*=1.10;    // ロデリックの大陸図
  if(inventory.rodmap&&seasonIdx()===2&&seasonDay()===1)res.fame=Math.min(9999,res.fame+4); // 図の名声
  let foodGain=0;

  for(const id in rooms){
    const r=rooms[id],d=ROOMS[r.type];if(!d)continue;
    if(!r.active){ if(d.pop&&r.occ>0&&Math.random()<.5)r.occ--; continue; }
    if(d.pop){
      if(r.happy>=60&&r.occ<d.pop)r.occ+=Math.random()<.85?(r.type==="bighouse"?2:1):0;
      else if(r.happy<40&&r.occ>0&&Math.random()<.6)r.occ--;
      if(pt==="father"&&r.happy>=60&&r.occ<d.pop&&Math.random()<.35)r.occ++; // 人民の父: 移住者増
      r.occ=clamp(r.occ,0,d.pop);
    }
    if(tideHigh&&r.f===0&&(d.base||d.food)){if(d.upkeep)expense+=d.upkeep;continue;} // 満潮休業
    if(d.rent)income+=d.rent*r.occ*(r.happy/100+.3)*rentMul;
    if(d.base)income+=d.base*commerceF*(0.5+r.happy/150)
      *(pt==="merchant"?1.18:1)
      *((r.type==="workshop"||r.type==="blacksmith")?craftMul:1)
      *(r.type==="brewery"&&inventory.brewrecipe?1.15:1);   // 古式醸造の覚書
    if(d.quest)income+=rnd(40,140)-d.base*commerceF*0.3+(cls.adventurer>=6?30:0); // クエスト変動+冒険者階級
    if(d.justice)income+=pop*0.3;                        // 裁判所: 司法収入
    if(d.upkeep)expense+=d.upkeep;
    // 茸園は洞窟気候ゆえ季節を問わない。畑は季節×収穫の祈り
    if(d.food)foodGain+=d.food*(r.type==="mushroom"?1:season.farm*(faithTier()>=1?1.15:1)*(weather.kind!=="clear"?1.25:1));
    if(d.wood)res.wood=Math.min(999,res.wood+d.wood);
    if(d.stone)res.stone=Math.min(999,res.stone+d.stone);
    if(d.iron)res.iron=Math.min(999,res.iron+d.iron+(flags.underAlly&&r.type==="mine"?1:0)); // 地底の盟約
    if(d.faith)res.faith=Math.min(999,res.faith+d.faith);
    if(d.fame)res.fame=Math.min(9999,res.fame+d.fame);
    if(d.lore){
      let l=d.lore;
      if(r.type==="magetower"&&r.f>=10)l+=1;
      res.lore+=l*loreMul;
    }
    if(r.type==="treasury")income+=Math.min(150,res.gold*0.015);
    if(r.type==="bank")income+=Math.min(300,res.gold*0.02);
    if(r.type==="throne")income+=pop*0.6;
    if(r.type==="skyhall")income+=pop*0.4;
  }
  if(route==="fantasy"&&milestones.m3)income+=120;  // 賢者の石
  if(cls.clergy>=6)res.faith=Math.min(999,res.faith+1);   // 聖職者階級
  if(cls.noble>=8)res.fame=Math.min(9999,res.fame+1);     // 貴族階級

  // 食料 (穀物庫で上限拡張)
  res.food=Math.min(foodCap(),res.food+foodGain);
  const need=pop*0.12*dm.food;
  if(isCreative()){res.food=Math.max(res.food,2000);}
  if(res.food>=need)res.food-=need;
  else{
    res.food=0;
    toast("🍞 食料が尽きた！ 領民が飢えている…（農場を増やし、冬に備えよ）","bad");
    for(const id in rooms){const r=rooms[id];
      if(ROOMS[r.type]&&ROOMS[r.type].pop){r.happy=clamp(r.happy-18,0,100);
        if(r.occ>0&&Math.random()<.4)r.occ--;}}
  }

  if(hasRet(2))income*=(retEvo[2]==="mogul"?1.15:retEvo[2]==="usurer"?1.10:1.08); // マルコ (進化で強化)
  if(retEvo[5]==="double"&&Math.random()<.12){
    const spyG=Math.round(rnd(40,110));res.gold+=spyG;
    toast("🎭 シルヴィアの諜報網が機密を売り捌いた +"+spyG+"G");
  }
  // 領主の性格と難易度
  income*=dm.inc;
  if(pt==="tyrant")income*=1.12;
  else if(pt==="artist")income*=0.92;
  if(pt==="father")expense*=1.15;
  else if(pt==="puppeteer")expense*=1.2;
  if(pt==="puppeteer"&&Math.random()<.15){
    const g=Math.round(rnd(30,90));res.gold+=g;
    toast("🕴 影の手の者が、どこかの帳簿から金を抜いてきた +"+g+"G");
  }
  // 銀行融資の返済 (130G/日)
  if(flags.debt>0){
    const pay=Math.min(flags.debt,130);
    flags.debt-=pay;expense+=pay;
    if(flags.debt<=0){delete flags.debt;toast("🏦 融資を完済した！ 銀行員が深々と頭を下げている","gold");}
  }
  // 投資の満期
  if(flags.invest&&day>=flags.invest.due){
    const g=Math.round(rnd(flags.invest.amt*0.7,flags.invest.amt*2.2));
    res.gold+=g;
    toast(g>=flags.invest.amt?"📈 投資が実を結んだ！ +"+fmt(g)+"G":"📉 投資先が振るわず…回収 +"+fmt(g)+"G",g>=flags.invest.amt?"gold":"bad");
    delete flags.invest;
  }
  const net=Math.round(income-expense);
  res.gold+=net;lastIncome=net;
  if(isCreative())res.gold=Math.max(res.gold,999999);
  if(net!==0)sndCoin();
  toast((net>=0?"📈 本日の収支 +":"📉 本日の収支 ")+fmt(net)+"G　🍞"+(foodGain?"+"+Math.round(foodGain):"±0"),net>=0?"gold":"bad");

  if(flags.mercUntil&&day===flags.mercUntil+1){
    delete flags.mercUntil;
    toast("🛡 傭兵団の契約期間が終わり、彼らは次の戦場へ去った");
  }
  // 信仰の祝福 (段階到達を告知)
  const ft=faithTier();
  if(ft>(flags.faithTier||0)){
    for(let i=(flags.faithTier||0);i<ft;i++)toast(FAITH_TIERS[i].msg,"gold");
    flags.faithTier=ft;sndMystic();
  }
  // サーガ後日談の恒常効果 (毎年めぐる実り)
  if(seasonIdx()===0&&seasonDay()===1){
    if(flags.rodCartographer)res.fame=Math.min(9999,res.fame+5);          // 地図庫の長
    if(flags.roseAlliance){res.gold+=300;toast("🌹 アヴェリンとの同盟交易が実った +300G","gold");}
    if(flags.marcoOrphanage){allHomes(4);res.fame=Math.min(9999,res.fame+3);
      toast("🏠 マルコの孤児院の子らが、春の花を城中に飾った（全住居の幸福+4）");}
  }
  if(seasonIdx()===2&&seasonDay()===1&&flags.boyScribe){
    res.lore+=4;toast("🖋 書記テオの写本が書庫に加わった "+loreName()+"+4");
  }
  checkMilestones();
  checkEra();
  chainTick();
  sagaTick();
  spawnDiscoveries();
  if(!maybeChoiceEvent())randomEvent(pop);
  checkRank(pop);
  recomputeHappiness();
  trackStreaks(pop);
  checkEndings(pop);
  scenarioTick();
  saveGame();
}

// ---------- 幸福ストリーク追跡 (人民の英雄 / 暴君の最期) ----------
function avgHappy(){
  let n=0,sum=0;
  for(const id in rooms){const r=rooms[id];
    if(ROOMS[r.type]&&(ROOMS[r.type].pop||ROOMS[r.type].rent)){n++;sum+=r.happy;}}
  return n?sum/n:0;
}
function trackStreaks(pop){
  const h=avgHappy();
  happyStreak=(h>=90&&pop>=250)?happyStreak+1:0;
  miseryStreak=(h<=25&&pop>=80&&persType()==="tyrant")?miseryStreak+1:0;
}

// ---------- マルチエンディング判定 ----------
function unlockEnding(k){
  if(endings[k])return;
  endings[k]=true;
  showEndingScroll(k);
  // true END: 特殊シナリオ限定(潮の王/地底王国)以外のすべてを見届けたか
  if(!endings.truend){
    const rest=Object.keys(ENDING_DEFS).filter(x=>x!=="truend"&&x!=="tide"&&x!=="deeproot");
    if(rest.every(x=>endings[x]))setTimeout(()=>unlockEnding("truend"),800);
  }
  saveGame();
}
function showEndingScroll(k){
  const e=ENDING_DEFS[k];
  pauseForModal();
  (k==="tyrant"||k==="babel")?beep(110,.5,"sawtooth",.07):sndFanfare();
  const got=Object.keys(endings).length;
  showScroll(`
    <h2>〜 年代記の結末 〜</h2>
    <div class="big-rank">${e.ico} ${e.name} ${e.ico}</div>
    <div class="chapter">${ENDING_TEXTS[k]}</div>
    <div class="center" style="margin-top:8px"><small>結末 ${got} / ${Object.keys(ENDING_DEFS).length} を見届けた（📜心得で一覧）<br>ゲームはこの後も続けられる</small></div>
    <button onclick="window.__closeScroll()">年代記に綴じる</button>
  `);
}
function checkEndings(pop){
  if(isCreative())return;                       // クリエイティブは記録外
  if(modalOpen)return;                          // 別の巻物の上には重ねない (翌日再判定)
  if(skyBuilt&&rankIdx>=RANKS.length-1)unlockEnding("sky");
  if(undergroundEnd)unlockEnding("under");
  if(happyStreak>=SEASON_LEN)unlockEnding("hero");
  if(res.gold>=200000)unlockEnding("commerce");
  if(yearNum()>=50)unlockEnding("time");
  // 文化の極み: 礼拝堂+酒場+貴族邸宅+学術(大学or魔法塔)が揃い、文化施設が計8棟
  const cul=countType("chapel")+countType("tavern")+countType("noble")
           +countType("university")+countType("magetower");
  if(countType("chapel")>=1&&countType("tavern")>=1&&countType("noble")>=1
     &&(countType("university")>=1||countType("magetower")>=1)&&cul>=8)unlockEnding("culture");
  // 暴君の最期: 絶望の1季節 → 反乱イベント
  if(miseryStreak>=SEASON_LEN&&!endings.tyrant){
    loseVillagers(0.25);res.gold=Math.max(0,res.gold-1000);
    unlockEnding("tyrant");miseryStreak=0;
  }
  // バベルの呪い: 46階(f>=45)より高くに部屋を築く
  if(!endings.babel)for(const id in rooms)if(rooms[id].f>=45){unlockEnding("babel");break;}
  // 天へ届きし塔: 最上階(50階)
  if(!endings.zenith)for(const id in rooms)if(rooms[id].f>=F_MAX){unlockEnding("zenith");break;}
  // 聖者の凱歌
  if(res.faith>=400&&countType("cathedral")>=1)unlockEnding("saint");
  // 大城主: 30種類の施設
  if(!endings.builder){
    const kinds=new Set(Object.values(rooms).map(r=>r.type));kinds.delete("gate");
    if(kinds.size>=30)unlockEnding("builder");
  }
  // 特殊シナリオの覇業
  if(isSpecial("mont")&&yearNum()>=3&&pop>=300)unlockEnding("tide");
  if(isSpecial("under")&&pop>=300)unlockEnding("deeproot");
  // 神になる: 専用イベントで提示 (showGodEvent)
  if(!endings.god&&!flags.godAsked&&route==="fantasy"&&skyBuilt&&res.lore>=400&&!modalOpen)showGodEvent();
}

// ---------- シナリオモード進行 ----------
function scenarioTick(){
  if(!isScenario()||scenarioCh>5)return;
  const ch=SCENARIO_CH[scenarioCh];
  if(!ch||modalOpen)return;
  let ok=false;try{ok=ch.chk();}catch(_){}
  if(!ok)return;
  res.gold+=ch.reward.gold;
  scenarioCh++;
  pauseForModal();sndFanfare();
  const next=SCENARIO_CH[scenarioCh];
  showScroll(`
    <h2>📯 ${ch.t}　達成！</h2>
    <div class="center">王都より褒賞 <b>${fmt(ch.reward.gold)}G</b> が届いた。</div>
    ${next?`<hr><div class="chapter"><b>📯 ${next.t}</b>${next.open}<br><br>目標：${next.goal}</div>`:
      `<hr><div class="chapter"><b>🏆 シナリオ「王国の興亡」完結</b>辺境の砦は、十字軍と疫病と戦乱の時代を生き延び、ルネサンスの光の中に立っている。年代記の正史は、ここに完成した。——この先は、そなたの自由な治世である。</div>`}
    <button onclick="window.__closeScroll()">承知した</button>
  `);
}

// ---------- 時代進化 (暗黒時代→中世盛期→ルネサンス) ----------
function checkEra(){
  let target=0;
  if(rankIdx>=2)target=1;                       // 男爵 → 中世盛期
  if(rankIdx>=4&&res.lore>=120)target=2;        // 公爵+学芸 → ルネサンス

  pauseForModal();sndFanfare();
  showScroll(`
    <h2>〜 時代の夜明け 〜</h2>

// ---------- 軽イベント（トースト） ----------
function randomEvent(pop){
  const roll=Math.random();
  let guard=hasRet(5)?(retEvo[5]==="shadow"?0.25:0.5):1; // シルヴィア (影の支配者=1/4)
  if(persType()==="puppeteer")guard*=0.6;                 // 影の操り人形師: 凶事さらに4割減
  if(faithTier()>=3)guard*=0.7;                           // 守護の奇跡
  if(inventory.bonecharm)guard*=0.85;                     // 骨の護符
  if(roll<.07*diffMul().raid&&pop>20){
    const sec=security();
    if(sec*45<pop){
      if(flags.prophecyShield){
        delete flags.prophecyShield;
        toast("🌙 月の預言者の警句どおり夜盗が来たが、備えは万全。被害なし！");
        return;
      }
      const loss=Math.min(res.gold,Math.round((rnd(60,160)+pop*0.8)*guard));
      res.gold-=loss;
      toast("⚠️ 夜盗の襲撃！ "+fmt(loss)+"G を奪われた…（兵舎で治安を高めよう）","bad");
      beep(110,.3,"sawtooth",.06);
    }else{
      if(retEvo[1]==="dark"){
        const loot=Math.round(rnd(50,140));res.gold+=loot;
        toast("🌑 暗黒騎士ローランドが夜盗を返り討ちにし、戦利品を奪った +"+loot+"G");
      }else{
        toast("🛡 夜盗が現れたが、騎士たちが撃退した！");
      }
    }
  }else if(roll<.12){
    const g=Math.round(rnd(80,220)*(inventory.luckycoin?1.1:1));  // 幸運の古銭
    res.gold+=g;
    toast("🐪 行商の隊列が城を訪れ、"+fmt(g)+"G の取引があった","gold");
  }
}

function chainTick(){
  if(modalOpen||day-lastEventDay<2)return;
  for(const id in chains){
    const st=chains[id];const def=CHAIN_DEFS[id];
    if(!def||st.done)continue;
    if(st.nextDay<=day&&def.stages[st.stage]){
      lastEventDay=day;
      showChainStage(id,st,def,def.stages[st.stage]);
      return;
    }
  }
}
function showChainStage(id,st,def,ev){
  pauseForModal();
  beep(520,.14,"triangle",.05);beep(390,.18,"triangle",.05,.12);
  showScroll(`
    <h2>${def.ico} ${def.name}</h2>
    <div class="ev-speaker">連鎖の物語　${st.stage+1} / ${def.stages.length}章</div>
    <div><b>${ev.t}</b><br>${ev.txt}</div>
    <div class="choice-btns">
      <button id="chA">${ev.a.label}</button>
      <button id="chB" class="alt">${ev.b.label}</button>
    </div>
  `);
  const pick=(c)=>{
    const msg=c.fx(st);
    if(c.end)st.done=true;
    else if(c.wait)st.nextDay=day+6;
    else{st.stage++;st.nextDay=day+4+Math.floor(rnd(0,4));}
    closeScroll();
    if(msg)toast(msg);
    recomputeHappiness();updateHUD();saveGame();
  };
  document.getElementById("chA").onclick=()=>pick(ev.a);
  document.getElementById("chB").onclick=()=>pick(ev.b);
}

function sagaHero(id){return SAGAS[id]&&SAGAS[id].hero;}
function maybeStartSagas(){
  for(const id in SAGAS){
    if(sagas[id])continue;
    let ok=false;try{ok=SAGAS[id].start();}catch(_){}
    if(ok){
      const intro=SAGAS[id].stages.intro;
      sagas[id]={stage:"intro",nextDay:day+1,status:intro.status,done:false};
    }
  }
}
function sagaTick(){
  if(modalOpen||day-lastEventDay<2)return;
  maybeStartSagas();
  for(const id in sagas){
    const st=sagas[id];const def=SAGAS[id];
    if(!def||st.done)continue;
    let stage=def.stages[st.stage];
    // 仮想ステージ(resolve)は即座に分岐先へ振り替える
    while(stage&&stage.resolve){
      st.stage=stage.resolve();st.status=def.stages[st.stage].status;stage=def.stages[st.stage];
    }
    if(stage&&st.nextDay<=day){
      lastEventDay=day;
      showSagaStage(id,st,def,stage);
      return;
    }
  }
}
function advanceSaga(st,def,to,gap,endStatus){
  if(to==="end"){st.done=true;st.status=endStatus||st.status;return;}
  st.stage=to;st.nextDay=day+(gap||SEASON_LEN);
  let nx=def.stages[to];
  while(nx&&nx.resolve){to=nx.resolve();nx=def.stages[to];st.stage=to;}
  st.status=nx?nx.status:st.status;
}
function showSagaStage(id,st,def,stage){
  pauseForModal();
  sndMystic();
  const h=def.hero;
  let btns,wire;
  if(stage.kind==="auto"){
    btns=`<button id="sgGo">つづきを読む</button>`;
    wire=()=>{document.getElementById("sgGo").onclick=()=>{
      closeScroll();advanceSaga(st,def,stage.to,stage.gap);
      recomputeHappiness();updateHUD();saveGame();
      if(SAGAS[id].stages[st.stage]) toast("🧭 ロデリックの物語は、まだ続く…");
    };};
  }else{
    btns=stage.choices.map((c,i)=>`<button id="sg${i}"${i?' class="alt"':''}>${c.label}</button>`).join("");
    wire=()=>stage.choices.forEach((c,i)=>{
      document.getElementById("sg"+i).onclick=()=>{
        const msg=c.fx?c.fx(st):"";
        closeScroll();
        advanceSaga(st,def,(typeof c.to==="function"?c.to():c.to),c.gap,c.endStatus);
        if(msg)toast(msg);
        recomputeHappiness();updateHUD();saveGame();
      };
    });
  }
  showScroll(`
    <h2>${def.ico} ${def.name}</h2>
    <div class="ev-speaker">${h.img?`<img class="ret-portrait" src="${h.img}" alt="${h.ico}" onerror="this.remove()">`:`<span style="font-size:20px">${h.ico}</span>`}
      <span>年代記サーガ ／ <b>${h.name}</b>（${h.role}）の物語</span></div>
    ${(stage.img||def.img)?`<img class="ev-illust" src="${stage.img||def.img}" alt="" onerror="this.remove()">`:""}
    <div><b>${stage.t}</b><br>${stage.txt}</div>
    <div class="choice-btns" style="${stage.choices&&stage.choices.length>2?'flex-direction:column':''}">${btns}</div>
    <div class="center" style="margin-top:8px"><small>―― つづく ――</small></div>
  `);
  wire();
}
function allHomes(d){
  for(const id in rooms){const r=rooms[id];
    if(ROOMS[r.type]&&(ROOMS[r.type].pop||ROOMS[r.type].rent))r.happy=clamp(r.happy+d,0,100);}
}
function loseVillagers(rate){
  for(const id in rooms){const r=rooms[id];
    if(ROOMS[r.type]&&ROOMS[r.type].pop&&r.occ>0)r.occ=Math.max(0,r.occ-Math.ceil(r.occ*rate));}
}
function countType(t){let n=0;for(const id in rooms)if(rooms[id].type===t&&rooms[id].active)n++;return n;}
function countBasement(){let n=0;for(const id in rooms)if(rooms[id].f<0)n++;return n;}

// 毎日の終わりに、どこかの部屋に✨を仕込む
function spawnDiscoveries(){
  if(Object.keys(discoveries).length>=2)return;
  const cultNext=flags.cult===1?"diary2":flags.cult===2?"diary3":null;
  const chance=cultNext?0.6:0.22;          // 教団の続きは見つかりやすい
  if(Math.random()>chance)return;
  const taken=new Set(Object.values(discoveries));
  const pool=Object.entries(DISCOVERIES).filter(([k,d])=>{
    if(taken.has(k))return false;
    if(d.once&&flags["dx_"+k])return false;
    if(cultNext&&k!==cultNext)return false;          // 続きを最優先
    try{if(d.cond&&!d.cond())return false;}catch(_){return false;}
    return Object.values(rooms).some(r=>r.active&&d.rooms.includes(r.type)&&!discoveries[r.id]);
  });
  if(!pool.length)return;
  const [k,d]=pool[Math.floor(Math.random()*pool.length)];
  const cand=Object.values(rooms).filter(r=>r.active&&d.rooms.includes(r.type)&&!discoveries[r.id]);
  const room=cand[Math.floor(Math.random()*cand.length)];
  discoveries[room.id]=k;
}
function runDiscovery(roomId){
  const k=discoveries[roomId];const d=DISCOVERIES[k];
  if(!d)return;
  delete discoveries[roomId];
  if(d.once)flags["dx_"+k]=true;
  const where=rooms[roomId]&&ROOMS[rooms[roomId].type]?ROOMS[rooms[roomId].type].name:"";
  hideInfo();
  pauseForModal();
  beep(740,.1,"triangle",.05);beep(990,.14,"triangle",.05,.1);
  showScroll(`
    <h2>${d.ico} ${d.t}</h2>
    <div class="ev-speaker">🔍 発見 — ${where}にて</div>
    <div>${d.txt}</div>
    <div class="choice-btns">
      <button id="dxA">${d.a.label}</button>
      <button id="dxB" class="alt">${d.b.label}</button>
    </div>
  `);
  const pick=c=>{
    const msg=c.fx(rooms[roomId]);
    closeScroll();
    if(msg)toast(msg);
    recomputeHappiness();updateHUD();saveGame();
  };
  document.getElementById("dxA").onclick=()=>pick(d.a);
  document.getElementById("dxB").onclick=()=>pick(d.b);
}

let lastEventDay=-3;
function maybeChoiceEvent(){
  if(modalOpen)return false;
  if(day-lastEventDay<3)return false;
  if(day<3)return false;
  if(Math.random()>.3)return false;
  const pool=EVENTS.filter(e=>{try{return e.cond();}catch(_){return false;}});
  if(!pool.length)return false;
  // 重み付き抽選 (wt: 既定1。珍しい出来事ほど小さく、日常ほど大きく)
  let tot=0;for(const e of pool)tot+=(e.wt||1);
  let roll=Math.random()*tot, ev=pool[0];
  for(const e of pool){roll-=(e.wt||1);if(roll<=0){ev=e;break;}}
  lastEventDay=day;
  showEvent(ev);
  return true;
}

function checkRank(pop){
  let target=rankIdx;
  for(let i=RANKS.length-1;i>=0;i--){
    const rk=RANKS[i];
    if(pop>=rk.pop&&(!rk.needsThrone||throneBuilt)&&(!rk.needsSky||skyBuilt)){target=i;break;}
  }
  if(target>rankIdx){
    rankIdx=target;
    res.fame=Math.min(9999,res.fame+rankIdx*15);   // 昇格は大陸に名を響かせる
    if(rankIdx>maxRankSeen){maxRankSeen=rankIdx;showRankUp();}
    updateToolbar();updateHUD();
  } else if(target<rankIdx){
    rankIdx=target;updateToolbar();updateHUD();
    toast("📉 人口減少により『"+RANKS[rankIdx].name+"』へ降格…","bad");
  }
  if(!sageShown&&rankIdx>=2&&!modalOpen){
    if(worldView.fantasy>=80&&worldView.fantasy>worldView.realism)autoRoute("fantasy");
    else if(worldView.realism>=80&&worldView.realism>worldView.fantasy)autoRoute("real");
    else showSageChoice();
  }
}

// ---------- 建設・撤去 ----------
function costAfter(d){
  if(isCreative())return {g:0,w:0,s:0,i:0};   // クリエイティブモードは無償
  const mul=hasRet(4)?(retEvo[4]==="legend"?0.8:retEvo[4]==="mbuild"?0.88:0.9):1; // ガストン (進化で強化)
  return {g:Math.round((d.cost.g||0)*mul),w:d.cost.w||0,s:d.cost.s||0,i:d.cost.i||0};
}
// 史実の道は現実の石積みの限界＝地上30階(f=29)まで。幻想の道は天井知らず(仕様書準拠)
const REAL_FCAP=29;
// 天空の間: 幻想は41階以上、史実は『大聖堂の尖塔』として26階以上(30階制限内)に築ける
function skyMinF(){return route==="real"?25:40;}
function costLabel(d){
  const c=costAfter(d);
  let s=fmt(c.g)+"G";
  if(c.w)s+=" "+c.w+"🪵";
  if(c.s)s+=" "+c.s+"🪨";
  if(c.i)s+=" "+c.i+"⚙️";
  return s;
}
function canPlace(type,c,f){
  const d=ROOMS[type];if(!d)return {ok:false,why:""};
  if(!isCreative()){
    if(rankIdx<d.rank)return{ok:false,why:RANKS[d.rank].name+"で解禁"};
    if(d.route&&route!==d.route)return{ok:false,why:"道の選択が必要"};
    if(d.mile&&!milestones[d.mile])return{ok:false,why:loreName()+"を高めて解禁"};
    if(d.era&&era<d.era)return{ok:false,why:ERAS[d.era].name+"の到来を待て"};
    if(d.needFaith&&res.faith<d.needFaith)return{ok:false,why:"信仰"+d.needFaith+"で着工できる"};
  }else if(d.route&&route&&route!==d.route)return{ok:false,why:"選ばなかった道の施設"};
  if(route==="real"&&f>REAL_FCAP&&!isCreative())
    return{ok:false,why:"史実の道は30階まで（石積みの限界）"};
  if(isSpecial("under")&&f>0&&!isCreative())
    return{ok:false,why:"地下帝国——地上に築くことは許されぬ"};
  const minF=(type==="skyhall")?skyMinF():d.minF;
  if(f<minF||f>d.maxF){
    if(minF<0&&d.maxF<0)return{ok:false,why:"地下専用"};
    if(minF>0)return{ok:false,why:(minF+1)+"階以上に建設"};
    return{ok:false,why:"この階には建てられない"};
  }
  if(c<0||c+d.w>COLS)return{ok:false,why:"敷地の外"};
  const hh=d.hh||1;
  if(hh>1){
    if(f<0)return{ok:false,why:"大建築は地上にのみ築ける"};
    if(f+hh-1>F_MAX)return{ok:false,why:"天に届きすぎる"};
    if(route==="real"&&f+hh-1>REAL_FCAP&&!isCreative())
      return{ok:false,why:"史実の道は30階まで（石積みの限界）"};
  }
  for(let j=0;j<hh;j++)for(let i=0;i<d.w;i++)
    if(built(c+i,f+j))return{ok:false,why:j?"上の階の空間も必要（高さ2階分）":"既に建物がある"};
  if(f>0){for(let i=0;i<d.w;i++)if(!built(c+i,f-1))return{ok:false,why:"下の階に土台が必要"};}
  if(f<0){for(let i=0;i<d.w;i++)if(!built(c+i,f+1))return{ok:false,why:"上に床がないと掘れない"};}
  const cost=costAfter(d);
  if(res.gold<cost.g)return{ok:false,why:"金貨不足"};
  if(res.wood<cost.w)return{ok:false,why:"木材不足（🪵タップで購入可）"};
  if(res.stone<cost.s)return{ok:false,why:"石材不足（🪨タップで購入可）"};
  if(res.iron<cost.i)return{ok:false,why:"鉄不足（⛰鉱山で産出・⚙️タップで購入可）"};
  return{ok:true,why:""};
}
function place(type,c,f){
  const chk=canPlace(type,c,f);
  if(!chk.ok){if(chk.why)toast("🚫 "+chk.why,"bad");sndErr();return false;}
  const d=ROOMS[type];
  const cost=costAfter(d);
  res.gold-=cost.g;res.wood-=cost.w;res.stone-=cost.s;res.iron-=cost.i;
  const r={id:nextRoomId++,type,f,c,w:d.w,hh:d.hh||1,occ:0,happy:70,active:false};
  rooms[r.id]=r;
  for(let j=0;j<r.hh;j++)for(let i=0;i<d.w;i++)grid[key(c+i,f+j)]=r.id;
  if(type==="throne"){throneBuilt=true;toast("👑 王座の間が完成した！ 玉座が主を待っている");}
  if(type==="skyhall"){skyBuilt=true;toast("🌟 天空の間が完成！ 雲の上に玉光が灯る");sndMystic();}
  if(type==="roost"){toast("🐲 若い竜が巣に舞い降りた！ 城の守護者となるだろう");startDragon();}
  if(f<=-9&&!undergroundEnd){undergroundEnd=true;if(!isCreative())unlockEnding("under");}
  recomputeReach();recomputeHappiness();
  sndPlace();updateHUD();
  return true;
}
function demolish(c,f){
  const r=cellRoom(c,f);
  if(!r){sndErr();return;}
  if(r.type==="gate"){toast("🚫 大門は城の心臓。壊せない","bad");sndErr();return;}
  const rh=r.hh||1;
  for(let i=0;i<r.w;i++)if(built(r.c+i,r.f+rh)){toast("🚫 上に建物が載っている","bad");sndErr();return;}
  const d=ROOMS[r.type];
  res.gold+=Math.floor((d.cost.g||0)/2);
  res.wood=Math.min(999,res.wood+Math.floor((d.cost.w||0)/2));
  res.stone=Math.min(999,res.stone+Math.floor((d.cost.s||0)/2));
  res.iron=Math.min(999,res.iron+Math.floor((d.cost.i||0)/2));
  for(let j=0;j<rh;j++)for(let i=0;i<r.w;i++)delete grid[key(r.c+i,r.f+j)];
  delete discoveries[r.id];
  delete rooms[r.id];
  if(r.type==="throne")throneBuilt=Object.values(rooms).some(x=>x.type==="throne");
  if(r.type==="skyhall")skyBuilt=Object.values(rooms).some(x=>x.type==="skyhall");
  recomputeReach();recomputeHappiness();
  beep(140,.12,"square",.05);updateHUD();hideInfo();
}

const AGENT_CAP=260;
function spawnAgent(kind,targetRoom){
  if(agents.length>=AGENT_CAP)return;
  const c=GATE_C+Math.floor(rnd(0,GATE_W));
  const look=kind==="knight"?null:pickLook();
  const a={kind,look,f:0,x:(c+.5)*TILE+rnd(-6,6),path:null,pi:0,wait:0,leaving:false,
    stress:0,jp:Math.random()*9,wdir:Math.random()<.5?-1:1,
    bob:Math.random()*7,speed:rnd(28,58)};
  if(look){
    if(look.quick)a.speed*=1.25;     // 子供は駆け回る
    if(look.slow)a.speed*=0.55;      // 老人はゆっくり
  }
  if(targetRoom){
    const p=findPath(c,0,targetRoom.c+Math.floor(rnd(0,targetRoom.w)),targetRoom.f);
    if(!p)return;
    a.path=p;a.target=targetRoom.id;
  }
  agents.push(a);
}
function findPath(c0,f0,c1,f1){
  const start=key(c0,f0),goal=key(c1,f1);
  if(!reachable.has(goal)||!reachable.has(start))return null;
  const prev={};prev[start]=null;
  const q=[[c0,f0]];
  while(q.length){
    const [c,f]=q.shift();
    if(c===c1&&f===f1){
      const path=[];let k=key(c,f);
      while(k){const[pc,pf]=k.split(",").map(Number);path.unshift([pc,pf]);k=prev[k];}
      return path;
    }
    const r=cellRoom(c,f);
    const push=(nc,nf)=>{const k=key(nc,nf);
      if(grid.hasOwnProperty(k)&&!(k in prev)&&walkableCell(nc,nf)){prev[k]=key(c,f);q.push([nc,nf]);}};
    push(c-1,f);push(c+1,f);
    if(r&&VERT(r.type))push(c,f+1);
    const below=cellRoom(c,f-1);
    if(below&&VERT(below.type))push(c,f-1);
  }
  return null;
}
function agentTick(dt){
  const isDay=dayT>0.05&&dayT<0.66;
  const evening=dayT>0.42&&dayT<0.72;
  const season=SEASONS[seasonIdx()];
  const visitMul=(season.visit)*((route==="fantasy"&&milestones.m1&&!isDay)?1.6:1)
    *(weather.kind==="storm"?0.5:weather.kind==="rain"?0.75:1);
  // 群衆スポーン
  const shops=Object.values(rooms).filter(r=>r.active&&ROOMS[r.type]&&ROOMS[r.type].base);
  const homes=Object.values(rooms).filter(r=>r.active&&(r.type==="quarters"||r.type==="bighouse")&&r.occ>0);
  const pop=population();
  const crowd=clamp(3+shops.length*2.4+pop*0.32,3,AGENT_CAP*0.9);
  if((shops.length||homes.length)&&agents.length<crowd&&Math.random()<dt*(isDay?2.2:1.1)*visitMul){
    const burst=1+Math.floor(Math.random()*3);
    for(let n=0;n<burst;n++){
      let pool=shops;
      if(!isDay){const tv=shops.filter(s=>s.type==="tavern");if(tv.length&&Math.random()<.7)pool=tv;}
      if(evening&&homes.length&&Math.random()<.45)pool=homes;
      if(!pool||!pool.length)pool=shops.length?shops:homes;
      if(pool.length)spawnAgent("visitor",pool[Math.floor(Math.random()*pool.length)]);
    }
  }
  // 騎士の巡回
  const barr=Object.values(rooms).filter(r=>r.active&&r.type==="barracks"&&r.occ>0);
  if(barr.length&&agents.filter(a=>a.kind==="knight").length<barr.length*3&&Math.random()<dt*.35){
    spawnAgent("knight",barr[Math.floor(Math.random()*barr.length)]);
  }
  for(let i=agents.length-1;i>=0;i--){
    const a=agents[i];
    if(a.wait>0){a.wait-=dt;
      const rr=rooms[a.target];
      // 座る・祈る・飲む系の部屋では落ち着いて滞在（横滑りしない）
      const settled=rr&&["tavern","chapel","monastery","cathedral","quarters",
        "bighouse","noble","royalsuite","university","magetower"].includes(rr.type);
      if(rr&&speed>0&&!settled){
        const minX=rr.c*TILE+3,maxX=(rr.c+rr.w)*TILE-3;
        a.x+=a.wdir*a.speed*0.4*dt*speed;
        if(a.x<minX){a.x=minX;a.wdir=1;}else if(a.x>maxX){a.x=maxX;a.wdir=-1;}
        if(Math.random()<dt*1.6)a.wdir*=-1;
      }
      a.stress=Math.max(0,a.stress-dt*14);
      if(a.wait<=0){
        const c=Math.floor(a.x/TILE);
        const p=findPath(clamp(c,0,COLS-1),a.f,GATE_C+1,0);
        if(p){a.path=p;a.pi=0;a.leaving=true;}else{agents.splice(i,1);}
      }
      continue;
    }
    if(!a.path){agents.splice(i,1);continue;}
    const node=a.path[a.pi];
    if(!node){
      if(a.leaving){agents.splice(i,1);}
      else a.wait=rnd(4,10);
      continue;
    }
    const [tc,tf]=node;
    const tx=(tc+.5)*TILE;
    if(tf!==a.f){
      // 昇降手段によってストレス変化
      const lower=Math.min(tf,a.f);
      const tr=cellRoom(tc,lower);
      if(tr){
        if(tr.type==="stairs")a.stress=Math.min(100,a.stress+7);
        else if(tr.type==="lift")a.stress=Math.max(0,a.stress-12);
        else if(tr.type==="mlift"||tr.type==="portal")a.stress=0;
      }
      a.f=tf;
    }
    const dx=tx-a.x;
    const step=a.speed*dt*(speed||0);
    if(Math.abs(dx)<=step){a.x=tx;a.pi++;
      if(a.pi>=a.path.length){a.path=null;
        if(a.leaving)agents.splice(i,1);else a.wait=rnd(4,10);}
    }else{a.x+=Math.sign(dx)*step;a.stress=Math.min(100,a.stress+dt*speed*5);}
    if(!built(Math.floor(a.x/TILE),a.f))agents.splice(i,1);
  }
}

function floorTopY(f){return WORLD_H - GROUND_DEPTH - (f - F_MIN + 1) * TILE;}

function skyColors(t){
  const phases=[
    [0.00,[255,183,120],[120,170,210]],
    [0.12,[150,205,235],[80,140,200]],
    [0.42,[235,160,110],[90,100,160]],
    [0.55,[40,40,80],[12,14,38]],
    [0.75,[16,18,44],[5,6,20]],
    [0.92,[120,90,130],[30,40,80]],
    [1.00,[255,183,120],[120,170,210]],
  ];
  let a=phases[0],b=phases[1];
  for(let i=0;i<phases.length-1;i++){
    if(t>=phases[i][0]&&t<=phases[i+1][0]){a=phases[i];b=phases[i+1];break;}
  }
  const u=(t-a[0])/(b[0]-a[0]||1);
  const mix=(p,q)=>p.map((v,i)=>Math.round(v+(q[i]-v)*u));
  return [mix(a[1],b[1]),mix(a[2],b[2])];
}
const isNight=()=>dayT>0.52||dayT<0.02;

function draw(){
  // W,H は「ワールド座標で見えている範囲」(画面px ÷ zoom)。以降の描画は全てワールド座標
  const W=cv.width/DPR/zoom,H=cv.height/DPR/zoom;
  ctx.setTransform(DPR*zoom,0,0,DPR*zoom,0,0);
  cam.x=clamp(cam.x,-160,Math.max(-160,WORLD_W-W+160));
  cam.y=clamp(cam.y,0,Math.max(0,WORLD_H-H+40));
  ctx.save();ctx.translate(-cam.x,-cam.y);
  const sIdx=seasonIdx(), winter=sIdx===3;

  // --- 空 ---
  const [top,bot]=skyColors(dayT);
  const g=ctx.createLinearGradient(0,cam.y,0,GROUND_Y);
  g.addColorStop(0,`rgb(${top.join(",")})`);
  g.addColorStop(1,`rgb(${bot.join(",")})`);
  ctx.fillStyle=g;ctx.fillRect(cam.x,cam.y,W,Math.max(0,GROUND_Y-cam.y));
  const night=isNight();
  if(night){
    ctx.fillStyle="rgba(255,255,230,.9)";
    for(const [sx,sy,tw] of stars){
      const a=.4+.6*Math.abs(Math.sin(perfNow*.001*tw*3+tw*9));
      ctx.globalAlpha=a;
      ctx.fillRect(cam.x+sx*W, cam.y+sy*(GROUND_Y-cam.y)*.8, 2,2);
    }
    ctx.globalAlpha=1;
  }
  const arcT=(dayT<0.5)?dayT/0.5:((dayT-0.5)/0.5);
  const cx=cam.x+W*(0.1+0.8*arcT);
  const cy=GROUND_Y-120-Math.sin(arcT*Math.PI)*Math.max(120,(GROUND_Y-cam.y-180));
  if(dayT<0.5){
    glowCirc(cx,cy,52,"255,230,150",.35);
    ctx.fillStyle="#ffe9a0";ctx.beginPath();ctx.arc(cx,cy,22,0,7);ctx.fill();
  }else{
    glowCirc(cx,cy,34,"220,225,240",.22);
    ctx.fillStyle="#e8e6da";ctx.beginPath();ctx.arc(cx,cy,17,0,7);ctx.fill();
    ctx.fillStyle=`rgb(${top.join(",")})`;ctx.beginPath();ctx.arc(cx+7,cy-4,15,0,7);ctx.fill();
  }
  // 昼は鳥の群れが空を渡る
  if(!night&&dayT>0.06&&dayT<0.45){
    ctx.strokeStyle="rgba(45,45,58,.65)";ctx.lineWidth=1;
    for(let b=0;b<4;b++){
      const p=((perfNow*.000016*(10+b*4))+b*.31)%1.2;
      if(p>1)continue;
      const bx2=cam.x+p*W, by2=cam.y+55+b*34+Math.sin(perfNow*.003+b*2)*5;
      const flp=Math.abs(Math.sin(perfNow*.014+b*1.8))*2.6;
      ctx.beginPath();
      ctx.moveTo(bx2-3.4,by2-flp);ctx.quadraticCurveTo(bx2,by2+1.2,bx2,by2);
      ctx.quadraticCurveTo(bx2,by2+1.2,bx2+3.4,by2-flp);ctx.stroke();
    }
  }
  ctx.fillStyle=night?"rgba(60,65,95,.55)":"rgba(255,255,255,.75)";
  for(const cl of clouds){
    const x=((cl.x+perfNow*.001*cl.s)%(WORLD_W+300))-150;
    ctx.beginPath();
    ctx.ellipse(x,cl.y+cam.y*0.15+60,cl.w,cl.w*.32,0,0,7);
    ctx.ellipse(x+cl.w*.5,cl.y+cam.y*0.15+50,cl.w*.6,cl.w*.26,0,0,7);
    ctx.fill();
  }
  // 遠景: 多層パララックス (奥の山ほどゆっくり流れる)
  const mtnLayer=(p,base,amp,col,fq,ph)=>{
    ctx.fillStyle=col;
    ctx.beginPath();ctx.moveTo(cam.x,GROUND_Y);
    for(let x=0;x<=W;x+=30){
      const k=(cam.x*p+x)*fq+ph;
      ctx.lineTo(cam.x+x,GROUND_Y-base-Math.abs(Math.sin(k))*amp);
    }
    ctx.lineTo(cam.x+W,GROUND_Y);ctx.closePath();ctx.fill();
  };
  mtnLayer(0.18, 75, 135, night?"#10142a":(winter?"#c3ccd8":"#7388a8"), .006, 0);   // 最遠の峰
  mtnLayer(0.40, 45,  95, night?"#141830":(winter?"#aab6c4":"#5d7390"), .009, 2.4); // 中景の山
  mtnLayer(0.65, 16,  52, night?"#0e1226":(winter?"#8b9aac":"#46597a"), .016, 5.1); // 近景の丘
  // 近景の丘には森の影 (大きさも間隔も不揃いな梢)
  ctx.fillStyle=night?"rgba(8,12,24,.5)":(winter?"rgba(90,104,120,.4)":"rgba(34,54,38,.5)");
  for(let x=0;x<=W;x+=9){
    const k=Math.floor((cam.x*0.65+x)/9);
    const hsh=((k*2654435761)>>>0)%100;          // 決め打ちの乱数
    if(hsh<38)continue;                          // 間引きで森の切れ間
    const hy=GROUND_Y-16-Math.abs(Math.sin(k*9*.016+5.1))*52;
    const rad=2.5+(hsh%5)*1.1, dy=3+(hsh%4)*2.2;
    ctx.beginPath();ctx.arc(cam.x+x,hy+dy,rad,0,7);ctx.fill();
  }
  // 高層に漂う雲海 (32階あたり。天空城郭は雲の上に頭を出す)
  const seaY=floorTopY(32);
  if(cam.y<seaY+260&&cam.y+H>seaY-160){
    const sea=(yy,p,al,sc)=>{
      ctx.fillStyle=night?`rgba(46,56,88,${al})`:`rgba(255,255,255,${al})`;
      ctx.beginPath();
      const drift=perfNow*.0035*sc;
      for(let x=-90;x<=W+90;x+=44*sc){
        const wx=cam.x+x;
        const k=(cam.x*p+x)*.02+drift;
        ctx.ellipse(wx,yy+Math.sin(k)*7,36*sc,11*sc,0,0,7);
      }
      ctx.fill();
    };
    sea(seaY+18,0.30,night?.45:.50,1.25);   // 奥の雲海 (ゆっくり)
    sea(seaY,    0.55,night?.55:.65,1.0);   // 手前の雲海
  }

  // --- 大地 (表土の帯 + 草むら + 深くなるほど暗い土) ---
  ctx.fillStyle=night?(winter?"#5e656e":"#241a10"):SEASONS[sIdx].ground;
  ctx.fillRect(cam.x,GROUND_Y,W,5);
  if(!winter){                                         // 草の穂がそよぐ
    ctx.strokeStyle=night?"rgba(40,60,30,.8)":"rgba(60,100,45,.9)";
    for(let gx2=Math.floor(cam.x/9)*9;gx2<cam.x+W;gx2+=9){
      const sway=Math.sin(perfNow*.002+gx2*.7)*1.2;
      ctx.beginPath();ctx.moveTo(gx2,GROUND_Y+1);ctx.lineTo(gx2+sway,GROUND_Y-3);ctx.stroke();
    }
  }
  const gSoil=ctx.createLinearGradient(0,GROUND_Y+5,0,GROUND_Y+220);
  if(night){gSoil.addColorStop(0,"#1d150d");gSoil.addColorStop(1,"#0e0a06");}
  else{gSoil.addColorStop(0,"#42301f");gSoil.addColorStop(1,"#241a10");}
  ctx.fillStyle=gSoil;
  ctx.fillRect(cam.x,GROUND_Y+5,W,WORLD_H-GROUND_Y);

  // --- 城外の並木 (季節で装いを変える) ---
  drawTrees(night,sIdx);
  ctx.fillStyle="rgba(0,0,0,.18)";
  for(let x=Math.floor(cam.x/40)*40;x<cam.x+W;x+=40)
    for(let y=GROUND_Y+18;y<WORLD_H;y+=26)
      ctx.fillRect(x+(y%52?12:0),y,16,5);

  // --- 竜 ---
  if(dragon){
    dragon.t+=0.016;
    dragon.x+=dragon.dir*1.7;
    const dy=dragon.y+Math.sin(dragon.t*2)*12;
    const flap=Math.sin(dragon.t*7);
    ctx.fillStyle=night?"#1a1626":"#3a2c44";
    ctx.save();ctx.translate(dragon.x,dy+cam.y*0.1);
    if(dragon.dir<0)ctx.scale(-1,1);
    ctx.beginPath();ctx.ellipse(0,0,26,7,0,0,7);ctx.fill();           // 胴
    ctx.beginPath();ctx.moveTo(20,-2);ctx.lineTo(36,-6);ctx.lineTo(22,4);ctx.closePath();ctx.fill(); // 頭
    ctx.beginPath();ctx.moveTo(-22,0);ctx.lineTo(-40,-4+flap*2);ctx.lineTo(-26,4);ctx.closePath();ctx.fill(); // 尾
    ctx.beginPath();ctx.moveTo(-4,-3);ctx.lineTo(6,-26*Math.abs(flap)-6);ctx.lineTo(10,-3);ctx.closePath();ctx.fill(); // 翼
    ctx.restore();
    if(dragon.x<-150||dragon.x>WORLD_W+150)dragon=null;
  }

  // --- 城（部屋） ---
  for(const id in rooms)drawRoom(rooms[id],night,sIdx);

  // --- 潮の城: 満潮の海 ---
  if(isSpecial("mont")&&day%6===0){
    const wy=floorTopY(0)+4;
    ctx.fillStyle="rgba(50,110,190,.42)";
    ctx.fillRect(cam.x,wy,W,TILE+8);
    ctx.fillStyle="rgba(220,240,255,.5)";
    for(let x=Math.floor(cam.x/26)*26;x<cam.x+W;x+=26)
      ctx.fillRect(x+((perfNow*.02)%26),wy+Math.sin(x*.2+perfNow*.003)*2,12,2);
  }

  // --- 胸壁＋雪 ---
  drawBattlements(night,winter);

  // --- 旗 ---
  drawBanner(night);

  // --- 住人 ---
  for(const a of agents)drawAgent(a,night);

  // --- 最前面を流れる薄雲 (高層のみ・城がうっすら霞む) ---
  {
    const seaY2=floorTopY(32);
    if(cam.y<seaY2+200&&cam.y+H>seaY2-120){
      ctx.fillStyle=night?"rgba(52,62,95,.28)":"rgba(255,255,255,.30)";

  }
  // --- 雪 ---
  if(winter){
    ctx.fillStyle="rgba(255,255,255,.85)";
    for(const s of snow){
      const x=cam.x+((s.x*W+perfNow*.01*s.sw)%W);

      ctx.fillRect(x,y,s.sw,s.sw);

  }
  // --- 雨と嵐 ---
  if(weather.kind!=="clear"){
    if(!winter){                                   // 斜めに走る雨脚
      ctx.strokeStyle=weather.kind==="storm"?"rgba(195,210,235,.55)":"rgba(170,190,220,.42)";
      ctx.lineWidth=1;
      const slant=weather.kind==="storm"?4.5:2;

        ctx.beginPath();ctx.moveTo(rx,ry);ctx.lineTo(rx-slant,ry+Math.min(dr.l,GROUND_Y-ry));ctx.stroke();
      }
    }
    // 空気を湿らせる青灰のベール (地上のみ)
    ctx.fillStyle=weather.kind==="storm"?"rgba(16,22,38,.22)":"rgba(28,38,58,.12)";
    ctx.fillRect(cam.x,cam.y,W,Math.max(0,Math.min(H,GROUND_Y-cam.y)));
    // 雷 (嵐のみ)
    if(weather.kind==="storm"){
      if(perfNow>lightning.next){
        lightning.at=perfNow;

      }

      if(flsh>0){ctx.fillStyle=`rgba(240,245,255,${flsh*.30})`;ctx.fillRect(cam.x,cam.y,W,H);}
    }
  }

  // --- 配置プレビュー ---
  if(hoverCell&&tool!=="select"&&tool!=="demolish"){
    const d=ROOMS[tool];

      ctx.fillRect(hoverCell[0]*TILE,py,d.w*TILE,phh*TILE);
      ctx.strokeStyle=chk.ok?"#9f9":"#f66";
      ctx.strokeRect(hoverCell[0]*TILE+.5,py+.5,d.w*TILE-1,phh*TILE-1);
    }
  }
  if(hoverCell&&tool==="demolish"){
    const r=cellRoom(hoverCell[0],hoverCell[1]);
    if(r&&r.type!=="gate"){
      const rhh=r.hh||1;
      ctx.fillStyle="rgba(220,60,40,.35)";
      ctx.fillRect(r.c*TILE,floorTopY(r.f+rhh-1),r.w*TILE,rhh*TILE);
    }
  }
  ctx.restore();

  // --- 仕上げ: 色調グレーディング (時間帯で世界全体のトーンを統一) ---
  if(gradeOn){
    const grade=isNight()?"rgba(72,92,150,.11)"
      :(dayT>0.42&&dayT<0.52)?"rgba(255,168,92,.11)"   // 夕焼けは琥珀
      :(dayT<0.08)?"rgba(255,190,140,.09)"             // 朝は薔薇色
      :"rgba(255,226,178,.07)";                        // 昼は羊皮紙色
    ctx.globalCompositeOperation="soft-light";
    ctx.fillStyle=grade;ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation="source-over";
    // 周辺減光 (視線が自然と城へ集まる)
    const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.42,W/2,H/2,Math.max(W,H)*.78);
    vg.addColorStop(0,"rgba(0,0,0,0)");vg.addColorStop(1,"rgba(12,9,6,.17)");
    ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  }
}

// ---- 小さな人物（多彩なポーズ＋衣装）。footY=足元のy、px=中心x ----
const SKINS=["#caa070","#b88a5a","#e0b888","#9a6a44"];
function mixCol(hex,target,t){       // hex色を target へ t(0-1) だけ寄せる
  const p=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const a=p(hex),b=p(target);
  return "rgb("+a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(",")+")";
}
function figure(px,footY,o){
  o=o||{};
  const sc=o.scale||1;
  if(sc!==1){ctx.save();ctx.translate(px,footY);ctx.scale(sc,sc);px=0;footY=0;}
  figureBody(px,footY,o);
  if(sc!==1)ctx.restore();
}
function figureBody(px,footY,o){
  const col=o.col||"#241a10";
  const skin=o.skin||SKINS[(o.seed||0)%SKINS.length];
  const tm=perfNow;
  ctx.fillStyle=col;
  if(o.pose==="sleep"){                              // 横たわって就寝
    ctx.fillStyle=o.blanket||"#8a5a3c";
    ctx.fillRect(px-4,footY-3,9,3);                  // 毛布
    ctx.fillStyle=skin;ctx.fillRect(px-6,footY-3,2.5,2.5); // 頭
    return;
  }
  if(o.pose==="sit"||o.pose==="drink"){              // 腰掛ける／一杯やる
    ctx.fillStyle=col;
    ctx.fillRect(px-2,footY-6,4,4);                  // 胴
    ctx.fillStyle=skin;ctx.fillRect(px-1.5,footY-9,3,3); // 頭
    ctx.fillStyle=col;ctx.fillRect(px-2.5,footY-2,5,1.6); // 前に出した脚
    if(o.pose==="drink"){
      const sip=Math.sin(tm*.004+(o.seed||0))>0.6?-1:0;
      ctx.fillStyle="#c9a227";ctx.fillRect(px+2,footY-7+sip,2.5,3); // ジョッキ
    }
    return;
  }
  if(o.pose==="kneel"||o.pose==="pray"){             // 跪いて祈る
    const sway=Math.sin(tm*.002+(o.seed||0))*0.6;
    ctx.fillStyle=col;
    ctx.fillRect(px-2+sway,footY-7,4,4);             // 胴(前傾)
    ctx.fillStyle=skin;ctx.fillRect(px-1.5+sway*1.4,footY-10,3,3); // 頭
    ctx.fillStyle=col;ctx.fillRect(px-3,footY-2,6,1.6); // 膝
    return;
  }
  // 立つ／歩く／働く／読む (立ち姿は静かに呼吸する)
  const breathe=(o.pose==="stand"||!o.pose)?Math.sin(tm*.003+(o.seed||0)*1.7)*.5:0;
  const head=footY-11+breathe;
  if(o.cape){                                        // マント (貴族など)
    ctx.fillStyle=o.cape;
    ctx.fillRect(px-3.4,head+3,2,6.5);
  }
  ctx.fillStyle=skin;ctx.fillRect(px-1.5,head,3,3);  // 頭
  if(o.hood){                                        // フード (修道士など)
    ctx.fillStyle=col;
    ctx.fillRect(px-2.2,head-1,4.4,2);
    ctx.fillRect(px-2.2,head,1.2,3);ctx.fillRect(px+1,head,1.2,3);
  }else if(o.hat){ctx.fillStyle=o.hat;ctx.fillRect(px-2,head-1.5,4,2);}
  if(o.hair){ctx.fillStyle=o.hair;ctx.fillRect(px-2,head-0.8,4,1.4);}  // 髪 (町娘など)
  ctx.fillStyle=col;ctx.fillRect(px-2,head+3,4,5);   // 胴
  const ph=o.pose==="walk"?(o.ph||0):0;
  if(o.skirt){                                       // スカート (裾広がり)
    ctx.fillStyle=col;
    ctx.beginPath();ctx.moveTo(px-2,head+7);ctx.lineTo(px+2,head+7);
    ctx.lineTo(px+3,footY);ctx.lineTo(px-3,footY);ctx.closePath();ctx.fill();
    ctx.fillStyle=skin;                              // 覗く足先
    ctx.fillRect(px-1.6+ph*.6,footY-1,1.2,1);ctx.fillRect(px+0.6-ph*.6,footY-1,1.2,1);
  }else if(o.pose==="walk"){
    ctx.fillRect(px-2+ph,footY-3,1.6,3);
    ctx.fillRect(px+0.4-ph,footY-3,1.6,3);
  }else{
    ctx.fillRect(px-2,footY-3,1.6,3);
    ctx.fillRect(px+0.4,footY-3,1.6,3);
  }
  // ---- 持ち物・小物 ----
  if(o.bag){ctx.fillStyle="#6e4a2e";ctx.fillRect(px+2.2,head+5,2.4,3);  // 行商の鞄
    ctx.fillStyle="#caa53c";ctx.fillRect(px+2.2,head+5.8,2.4,0.7);}
  if(o.cane){ctx.strokeStyle="#7a5430";ctx.lineWidth=1;                 // 老人の杖
    ctx.beginPath();ctx.moveTo(px+3,head+5);ctx.lineTo(px+3+ph*.4,footY);ctx.stroke();}
  if(o.sword){ctx.strokeStyle="#9aa6b2";ctx.lineWidth=1;                // 冒険者の剣
    ctx.beginPath();ctx.moveTo(px-3,head+8);ctx.lineTo(px-1.4,head+2.5);ctx.stroke();
    ctx.fillStyle="#7a5430";ctx.fillRect(px-2.6,head+6.4,1.8,1.2);}
  if(o.basket){ctx.fillStyle="#b8a45a";ctx.fillRect(px+2,head+4.5,2.6,2);} // 麦籠
  if(o.pose==="work"){
    const sw=Math.sin(tm*.012+(o.seed||0))*3;
    ctx.fillStyle="#7a5430";ctx.fillRect(px+2,head+1+sw,1.6,5);    // 振り上げる道具
  }else if(o.pose==="read"){
    ctx.fillStyle="#e6dcc2";ctx.fillRect(px+1.5,head+4,3.5,2.5);   // 書物
  }else if(o.pose==="shop"){
    ctx.fillStyle="#8a6a3a";ctx.fillRect(px+2,head+4,2,2);         // 買い物籠
  }
}

// ---- 町の人々の見た目 (歩く住人は黒い人ではなく、それぞれの暮らしの姿で) ----
const AGENT_LOOKS=[
  {k:"peasant", col:"#5a4a2c", hat:"#c9b46a", basket:true, w:1.5},     // 麦わら帽の農夫
  {k:"woman",   col:"#8a4a5e", hair:"#3a2a18", skirt:true, w:1.3},     // 町娘
  {k:"merchant",col:"#46618a", hat:"#2a3a56", bag:true,   w:1.0},      // 行商人
  {k:"craftsman",col:"#6e4a2e", hat:"#4a3422",            w:1.0},      // 職人
  {k:"monk",    col:"#7a7468", hood:true,                 w:0.7},      // 修道士
  {k:"noble",   col:"#5e3a78", hat:"#caa53c", cape:"#8e2b2b", w:0.5},  // 貴族
  {k:"child",   col:"#a05a30", scale:0.72, quick:true,    w:0.9},      // 子供 (小さくて素早い)
  {k:"elder",   col:"#4e4e46", cane:true, slow:true,      w:0.6},      // 杖の老人
  {k:"adventurer",col:"#3a5c3a", hat:"#5a7a52", sword:true, w:0.7, fantasy:true}, // 冒険者
];
function pickLook(){
  const pool=AGENT_LOOKS.filter(l=>!l.fantasy||route==="fantasy");
  let tot=0;for(const l of pool)tot+=l.w;
  let roll=Math.random()*tot;
  for(const l of pool){roll-=l.w;if(roll<=0)return l;}
  return pool[0];
}
// ===== 質感ヘルパー (掟其の一: グラデ・グロー・角丸) =====
// 角丸長方形パス
function rrect(x,y,w,h,rad){
  rad=Math.min(rad,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+rad,y);
  ctx.arcTo(x+w,y,x+w,y+h,rad);ctx.arcTo(x+w,y+h,x,y+h,rad);
  ctx.arcTo(x,y+h,x,y,rad);ctx.arcTo(x,y,x+w,y,rad);
  ctx.closePath();
}
// 放射グラデの光彩 (魔法・灯り・宝物のグロウ)
function glowCirc(gx,gy,rad,rgb,alpha){
  const g=ctx.createRadialGradient(gx,gy,0,gx,gy,rad);
  g.addColorStop(0,`rgba(${rgb},${alpha})`);
  g.addColorStop(.55,`rgba(${rgb},${alpha*.45})`);
  g.addColorStop(1,`rgba(${rgb},0)`);
  ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(gx,gy,rad,0,7);ctx.fill();
}
// 煙突の煙 (ゆらゆら立ち上って薄れる)
function smokePuffs(sx,sy,seed){
  for(let k=0;k<3;k++){
    const p=((perfNow*.00045)+k*.34+(seed%7)*.13)%1;
    const a=.26*(1-p);
    ctx.fillStyle=`rgba(205,205,210,${a})`;
    ctx.beginPath();
    ctx.arc(sx+Math.sin(p*5+seed)*3.2,sy-p*15,1.4+p*3,0,7);
    ctx.fill();
  }
}
// 壁掛けランプ／燭台。夜は炎が揺れ、温かい光輪を落とす
function lamp(lx,ly,lit,seed){
  seed=seed||0;
  ctx.fillStyle="#3a2a16";ctx.fillRect(lx-1,ly,2,4);            // 受け金具
  if(lit){
    const fl=.6+.4*Math.sin(perfNow*.012+seed*2.3);
    glowCirc(lx,ly,8+fl*2.5,"255,180,70",.30*fl+.12);           // 光輪
    ctx.fillStyle=`rgba(255,150,40,${.55+.35*fl})`;             // 炎
    ctx.beginPath();ctx.moveTo(lx-1.4,ly+1);ctx.quadraticCurveTo(lx,ly-4-fl*2,lx+1.4,ly+1);ctx.closePath();ctx.fill();
    ctx.fillStyle=`rgba(255,240,180,${.8})`;ctx.fillRect(lx-.6,ly-1,1.2,2);
  }else{
    ctx.fillStyle="#caa53c";ctx.fillRect(lx-1.2,ly-2,2.4,3);    // 消えた蝋燭
    ctx.fillStyle="#6b5234";ctx.fillRect(lx-.5,ly-3.5,1,1.5);
  }
}
// 住居：ベッドを occ に合わせて並べ、夜は就寝・昼は団欒
function drawDwelling(r,x,y,w,h,night,o){
  const beds=o.beds, occ=clamp(r.occ,0,beds);
  const lit=night&&r.occ>0;
  // 奥壁の漆喰と腰板
  ctx.fillStyle=o.posh?"#6e5d44":"#574a39";ctx.fillRect(x+2,y+2,w-4,h-5);
  ctx.fillStyle=o.posh?"#4e4030":"#41372a";ctx.fillRect(x+2,y+h-7,w-4,3); // 腰板
  // 上辺の窓（各タイル）と窓辺の植木（裕福な家）
  for(let i=0;i<r.w;i++){
    const wx=x+i*TILE+TILE-9;
    ctx.fillStyle=lit?"rgba(255,200,110,.95)":(night?"#1b2330":"#5a86b0");
    ctx.fillRect(wx,y+3,7,6);
    ctx.strokeStyle="#2e2113";ctx.lineWidth=1;ctx.strokeRect(wx+.5,y+3.5,6,5);
    ctx.beginPath();ctx.moveTo(wx+3.5,y+3);ctx.lineTo(wx+3.5,y+9);ctx.stroke();
    ctx.moveTo(wx,y+6);ctx.lineTo(wx+7,y+6);ctx.stroke();
    if(o.posh){ctx.fillStyle="#6e4a2e";ctx.fillRect(wx,y+9,7,1.5);        // プランター
      ctx.fillStyle="#74a050";ctx.fillRect(wx+1,y+8,1.5,1.5);ctx.fillRect(wx+4,y+8,1.5,1.5);
      ctx.fillStyle="#cf7890";ctx.fillRect(wx+2.5,y+7.5,1,1);}            // 花
  }
  // 壁掛けランプ（タイルごと交互に）
  for(let i=0;i<r.w;i++)lamp(x+i*TILE+5,y+7,lit,r.id+i);
  // 床の敷物
  ctx.fillStyle=o.posh?"#7a2e2e":"#4a3a26";ctx.fillRect(x+3,y+h-4,w-6,2);
  if(o.posh){ctx.fillStyle="#caa53c";for(let i=3;i<w-6;i+=5)ctx.fillRect(x+i,y+h-3.5,2,1);} // 金糸
  ctx.fillStyle="#3a2e20";ctx.fillRect(x,y+h-2,w,2);                      // 床板
  // 奥壁に額（裕福）か質素な棚
  if(o.posh){ctx.fillStyle="#caa53c";ctx.strokeStyle="#7a5c20";
    ctx.fillRect(x+3,y+5,5,5);ctx.strokeRect(x+3.5,y+5.5,4,4);}
  else{ctx.fillStyle="#5d4a32";ctx.fillRect(x+w-9,y+11,7,1.5);
    ctx.fillStyle="#8a7a52";ctx.fillRect(x+w-8,y+9,1.5,2);ctx.fillRect(x+w-5,y+9,1.5,2);} // 棚と壺
  for(let b=0;b<beds;b++){
    const bx=x+w*(b+0.5)/beds, by=y+h-5;
    // ベッド枠＋脚
    ctx.fillStyle=o.posh?"#6b3f86":"#6e4a2e";ctx.fillRect(bx-6,by-2,12,4);
    ctx.fillStyle="#4e3420";ctx.fillRect(bx-6,by+1,1.5,2);ctx.fillRect(bx+4.5,by+1,1.5,2);
    ctx.fillStyle="#d8d0c0";ctx.fillRect(bx-6,by-3,3,3);             // 枕
    ctx.fillStyle=o.posh?"#caa0e0":"#b08a64";ctx.fillRect(bx-3,by-2,9,2); // 掛布
    if(o.posh){ctx.fillStyle="#7e1f1f";ctx.fillRect(bx-6,by-5,12,2);ctx.fillStyle="#caa53c";ctx.fillRect(bx-6,by-5,12,.6);} // 天蓋
    if(b<occ){
      if(night){
        figure(bx-1,by+2,{pose:"sleep",blanket:o.posh?"#9a6ac0":"#8a5a3c",seed:r.id+b});
        if(b===0){ctx.fillStyle="rgba(255,255,255,.5)";ctx.font="italic 7px serif";
          ctx.fillText("z",bx+5,by-4);}
      }else{
        const wears=o.posh?["#3a2a4a","#5e3a78","#6b3050"]:["#5a4a2c","#6e4a2e","#8a4a5e","#46618a","#4e5a3a"];
        figure(bx,by,{pose:(b+r.c)%3===0?"stand":"sit",col:wears[(r.id+b)%wears.length],
          hat:o.posh?"#caa53c":null,skirt:(r.id+b)%3===1&&!o.posh,seed:r.id+b});
      }
    }
  }
}
function drawRoom(r,night,sIdx){
  const hh=r.hh||1;
  const x=r.c*TILE,y=floorTopY(r.f+hh-1),w=r.w*TILE,h=hh*TILE;
  // 壁: ベタ塗りではなく上が明るい縦グラデ (掟其の一)
  const gWall=ctx.createLinearGradient(0,y,0,y+h);
  if(r.f<0){gWall.addColorStop(0,"#5a5044");gWall.addColorStop(1,"#443b31");}
  else{gWall.addColorStop(0,"#8d8579");gWall.addColorStop(.55,"#7b746a");gWall.addColorStop(1,"#6c655b");}
  ctx.fillStyle=gWall;ctx.fillRect(x,y,w,h);
  // 石のまだら (決め打ちの乱数で明暗のムラ)
  for(let row=0;row<hh*2;row++){
    for(let i=0;i<r.w*2;i++){
      const hsh=(r.id*31+row*7+i*13)%9;
      if(hsh<2){ctx.fillStyle=hsh?"rgba(255,250,235,.05)":"rgba(20,14,8,.07)";
        const bx=x+i*TILE/2+(((r.f+row)%2)?TILE/4:0);
        ctx.fillRect(bx,y+row*TILE/2,TILE/2,TILE/2);}
    }
  }
  // 目地は薄い茶系 (真っ黒は使わない: 掟其の三)
  ctx.strokeStyle="rgba(40,28,16,.22)";ctx.lineWidth=1;
  for(let row=0;row<hh*2;row++){
    for(let i=0;i<r.w*2;i++){
      const bx=x+i*TILE/2+(((r.f+row)%2)?TILE/4:0);
      ctx.strokeRect(bx+.5,y+row*TILE/2+.5,TILE/2,TILE/2);
    }
  }
  // 左から陽が当たり、右へ影が落ちる
  ctx.fillStyle="rgba(255,236,200,.08)";ctx.fillRect(x,y,2,h);
  ctx.fillStyle="rgba(255,255,245,.06)";ctx.fillRect(x,y,w,2);
  ctx.fillStyle="rgba(15,10,5,.13)";ctx.fillRect(x+w-2,y,2,h);
  // 夜は外壁がほんのり青く沈む
  if(night){ctx.fillStyle="rgba(14,20,38,.22)";ctx.fillRect(x,y,w,h);}
  ctx.fillStyle="#3a2e20";ctx.fillRect(x,y+h-3,w,3);
  // 建物のフチを締める外枠 (外は太く、内側のディテールは細く: 掟其の二)
  ctx.strokeStyle="rgba(28,20,12,.5)";ctx.lineWidth=1.5;
  ctx.strokeRect(x+.75,y+.75,w-1.5,h-1.5);ctx.lineWidth=1;
  const t=perfNow*.001;
  const warm=(a)=>`rgba(255,190,90,${a})`;
  switch(r.type){
    case "gate":{
      ctx.fillStyle="#5d4326";
      ctx.beginPath();
      ctx.moveTo(x+w*.18,y+h);ctx.lineTo(x+w*.18,y+h*.38);
      ctx.quadraticCurveTo(x+w*.5,y-h*.1,x+w*.82,y+h*.38);
      ctx.lineTo(x+w*.82,y+h);ctx.closePath();ctx.fill();
      ctx.strokeStyle="#2e2113";ctx.lineWidth=2;
      for(let i=1;i<5;i++){const gx=x+w*.18+(w*.64)*i/5;
        ctx.beginPath();ctx.moveTo(gx,y+h*.3);ctx.lineTo(gx,y+h);ctx.stroke();}
      ctx.lineWidth=1;
      ctx.fillStyle="#caa53c";ctx.fillRect(x+w*.46,y+h*.55,4,4);
      break;}
    case "corridor":{
      if(night){
        const fl=.5+.3*Math.sin(t*9+r.c);
        ctx.fillStyle=warm(.18*fl+.1);
        ctx.beginPath();ctx.arc(x+w/2,y+9,7,0,7);ctx.fill();
        ctx.fillStyle="#caa53c";ctx.fillRect(x+w/2-1,y+8,2,6);
        ctx.fillStyle="rgba(255,140,40,.8)";ctx.fillRect(x+w/2-2,y+5,4,4);
      }
      break;}
    case "stairs":{
      ctx.fillStyle="#5a5248";
      for(let i=0;i<5;i++)ctx.fillRect(x+3+i*4,y+h-4-i*4.4,TILE-6-i*4,4);
      ctx.fillStyle="rgba(0,0,0,.25)";ctx.fillRect(x+2,y,3,h);
      break;}
    case "lift":{
      ctx.fillStyle="#3a3328";ctx.fillRect(x+4,y+2,TILE-8,h-5);
      ctx.strokeStyle="#caa53c";ctx.strokeRect(x+4.5,y+2.5,TILE-9,h-6);
      const ly=y+5+(Math.sin(t*1.5+r.c)*.5+.5)*(h-14);
      ctx.fillStyle="#8a7a52";ctx.fillRect(x+6,ly,TILE-12,6);
      ctx.strokeStyle="#6b5234";
      ctx.beginPath();ctx.moveTo(x+TILE/2,y+2);ctx.lineTo(x+TILE/2,ly);ctx.stroke();
      break;}
    case "mlift":{
      const fl=.5+.5*Math.sin(t*4+r.c);
      ctx.fillStyle="#241a32";ctx.fillRect(x+4,y+2,TILE-8,h-5);
      ctx.strokeStyle=route==="fantasy"?"#9a6ae0":"#6493bd";
      ctx.strokeRect(x+4.5,y+2.5,TILE-9,h-6);
      ctx.fillStyle=route==="fantasy"?`rgba(170,110,240,${.3+.4*fl})`:`rgba(110,170,240,${.3+.4*fl})`;
      ctx.fillRect(x+6,y+4,TILE-12,h-9);
      glowCirc(x+TILE/2,y+h/2,9+fl*3,route==="fantasy"?"170,110,240":"110,170,240",.30+.18*fl);
      break;}
    case "farm":{
      const cropCol=[["#7cb05a","#9ac56e"],["#caa53c","#e0c060"],["#b08030","#caa040"],["#cfd6dc","#e8edf2"]][sIdx];

      const pl=.5+.5*Math.sin(t*3);
      glowCirc(x+w/2,y+h-9,9+pl*3,"235,80,50",.45+.25*pl);
      ctx.fillStyle=`rgba(230,70,45,${.7+.3*pl})`;ctx.beginPath();ctx.arc(x+w/2,y+h-9,2.6+pl,0,7);ctx.fill();

      }
      break;}
  }
  if(!built(r.c-1,r.f)){ctx.fillStyle="#5b5347";ctx.fillRect(x,y,3,h);}
  if(!built(r.c+r.w,r.f)){ctx.fillStyle="#5b5347";ctx.fillRect(x+w-3,y,3,h);}
